<title>Groundwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- Industry design system: tokens ---- */
  :root {
    --color-bg: #f2f2f3; --color-surface: #e9e9ea; --color-text: #1d1f20;
    --color-accent: #5980a6; --color-accent-2: #728fab;
    --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);

    --color-neutral-100: #f5f5f8; --color-neutral-200: #e7e7ea; --color-neutral-300: #d4d4d7;
    --color-neutral-400: #b7b7ba; --color-neutral-500: #98989b; --color-neutral-600: #7a7a7d;
    --color-neutral-700: #5d5d60; --color-neutral-800: #424244; --color-neutral-900: #2b2b2d;

    --color-accent-100: #eef6ff; --color-accent-200: #d6ebff; --color-accent-300: #b5d9fd;
    --color-accent-400: #94bce3; --color-accent-500: #749dc4; --color-accent-600: #597ea3;
    --color-accent-700: #416180; --color-accent-800: #2c455d; --color-accent-900: #1d2d3d;

    --color-flag: #9a6a1f; --color-flag-bg: #f8eeda; --color-danger: #8c3b2e;

    --font-heading: "Barlow Condensed", system-ui, sans-serif;
    --font-body: "Barlow", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;

    --space-1: 3.4px; --space-2: 6.8px; --space-3: 10.2px; --space-4: 13.6px;
    --space-6: 20.4px; --space-8: 27.2px;
    --radius-md: 4px;
    --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
    --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  }
  /* This design system (from the supplied mockup) is a single light scheme —
     no dark variant was specified, and it should not follow the viewer's OS
     dark-mode preference. Always render the light tokens above. */
  :root { color-scheme: light; }

  *, *::before, *::after { box-sizing: border-box; }
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body);
    font-size: 15px; line-height: 1.55; margin: 0; -webkit-font-smoothing: antialiased; }
  .shell { max-width: 1180px; margin: 0 auto; }

  h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); font-weight: 600;
    line-height: 1.12; letter-spacing: -0.015em; margin: 0; text-wrap: balance;
    color: var(--color-accent-700); }
  h1 { font-size: 40px; } h2 { font-size: 30px; } h3 { font-size: 25px; }
  h4 { font-size: 20px; } h5 { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
  p { margin: 0; }
  .stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .stack-lg { display: flex; flex-direction: column; gap: var(--space-8); }
  .muted { color: var(--color-neutral-700); }
  .small { font-size: 0.87rem; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  ::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

  .kick { font: 500 10px/1 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--color-accent-700); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---- blueprint frame: transparent, hairline, square, registration marks ---- */
  .blueprint { position: relative; border: 1px solid var(--color-divider); border-radius: 0; }
  .blueprint > .corner { position: absolute; width: 11px; height: 11px;
    color: color-mix(in srgb, var(--color-text) 55%, transparent); }
  .blueprint > .corner::before, .blueprint > .corner::after { content: ""; position: absolute; background: currentColor; }
  .blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
  .blueprint > .corner::after { top: 5px; left: 0; width: 100%; height: 1px; }
  .blueprint > .corner.tl { top: -6px; left: -6px; }
  .blueprint > .corner.tr { top: -6px; right: -6px; }
  .blueprint > .corner.bl { bottom: -6px; left: -6px; }
  .blueprint > .corner.br { bottom: -6px; right: -6px; }

  .card { padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .card.accent { border-color: var(--color-accent); }

  textarea, input[type="text"] { width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
    font-size: 15px; color: var(--color-text); caret-color: var(--color-accent);
    background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 0; }
  textarea { min-height: 96px; resize: vertical; line-height: 1.6; padding: 12px 14px; }
  textarea:hover, input[type="text"]:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
  textarea:focus-visible, input[type="text"]:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
  input[type="text"] { min-height: 44px; }
  label.fieldlabel { display: block; font-size: 12px; margin-bottom: 5px;
    color: color-mix(in srgb, var(--color-text) 70%, transparent); }

  button { font-family: var(--font-heading); font-weight: 600; font-size: 14px; line-height: 1.2;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; min-height: 44px; padding: 10px 18px;
    color: var(--color-text); background: transparent; border: 1px solid var(--color-divider); border-radius: 0; }
  button:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  button.primary { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
  button.primary:hover { background: var(--color-accent-600); }
  button.primary:active { background: var(--color-accent-700); }
  button.link { border: none; background: none; padding: 0; min-height: auto; font-family: var(--font-body);
    font-weight: 600; font-size: 0.85rem; color: var(--color-accent-700); text-decoration: underline; }
  button.link:hover { background: none; color: var(--color-accent); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:disabled:hover { background: transparent; }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* ---- status system: icon + text, never color alone ---- */
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; letter-spacing: 0.02em;
    padding: 3px 10px; min-height: 22px; border-radius: 0; white-space: nowrap; }
  .tag svg { flex: none; }
  .tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
  .tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
  .tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent-700); }

  /* ---- nav + step bar ---- */
  .nav { display: flex; align-items: center; gap: var(--space-4); padding: 14px 24px;
    border-bottom: 1px solid var(--color-divider); flex-wrap: wrap; }
  .nav-brand { font-family: var(--font-heading); font-weight: 600; font-size: 18px; margin-right: auto; }
  .nav a { color: inherit; text-decoration: none; font-size: 14px; cursor: pointer; }
  .nav a:hover { color: var(--color-accent); }
  .stepbar { display: flex; border-bottom: 1px solid var(--color-divider); }
  .stepbar .step { flex: 1; padding: 14px 18px; display: flex; gap: 10px; align-items: center;
    border-left: 1px solid var(--color-divider); color: var(--color-neutral-700); }
  .stepbar .step:first-child { border-left: none; }
  .stepbar .step.now { background: var(--color-accent-100); border-bottom: 2px solid var(--color-accent);
    margin-bottom: -1px; color: var(--color-text); }
  .stepbar .step .steplabel { font-family: var(--font-heading); font-size: 15px; color: var(--color-text); }
  .stepbar .step.locked .steplabel { color: var(--color-neutral-700); }
  .stepbar .step .stepmeta { margin-left: auto; font-size: 11px; letter-spacing: 0.08em; }
  .stepbar .step.now .stepmeta { color: var(--color-accent-800); }
  .stepbar .step svg.stepdone { color: var(--color-accent-700); flex: none; }

  .screenpad { padding: 40px 44px 48px; display: flex; flex-direction: column; gap: 24px; }
  @media (max-width: 700px) { .screenpad { padding: 28px 20px 40px; } }

  .seclist { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; }
  .seclist li { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent); font-size: 14px; }
  .seclist li.now { border-bottom: 1px solid var(--color-accent); font-weight: 500; }
  .seclist li.notstarted { color: var(--color-neutral-700); }

  .mobilerail { display: flex; gap: 4px; margin: 0 24px; }
  .mobilerail span { flex: 1; height: 4px; background: var(--color-divider); }
  .mobilerail span.done { background: var(--color-accent); }
  .mobilerail span.now { background: var(--color-accent); opacity: 0.45; }
  @media (min-width: 900px) { .mobilerail { display: none; } }

  .coachnote { display: flex; gap: 14px; padding: 14px 0 14px 16px; border-left: 2px solid var(--color-accent); }
  .coachnote p { font-size: 14.5px; line-height: 1.6; color: var(--color-accent-800); margin: 0; }
  /* What the leader already brought. Deliberately a different shape from
     .coachnote (tinted block vs. rule) so affirmation and verdict can never
     be mistaken for one blended statement. */
  .strengthnote { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px;
    background: var(--color-accent-100); }
  .strengthnote svg { flex: none; margin-top: 3px; color: var(--color-accent-700); }
  .strengthnote p { font-size: 14px; line-height: 1.55; color: var(--color-accent-900); margin: 0; }

  .thinking { display: flex; align-items: center; gap: 10px; color: var(--color-neutral-700); }
  .thinking .dot { width: 8px; height: 8px; background: var(--color-accent);
    animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .thinking .dot { animation: none; } }

  .oversight { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; background: var(--color-accent-100); }
  .oversight svg { flex: none; margin-top: 2px; color: var(--color-accent-800); }
  .oversight p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--color-accent-900); }

  .draftcard { background: var(--color-bg); padding: 20px 22px; }
  .draftcard p { margin: 0; font-size: 14px; line-height: 1.65; }
  .hl { background: var(--color-accent-200); }

  .queue { display: flex; flex-direction: column; }
  .queueitem { display: flex; gap: 11px; padding: 14px 22px; align-items: flex-start; text-align: left;
    border: none; background: none; width: 100%; min-height: auto; font: inherit; cursor: pointer; }
  .queueitem:hover { background: color-mix(in srgb, var(--color-text) 5%, transparent); }
  .queueitem.now { background: var(--color-accent-100); border-left: 2px solid var(--color-accent); }
  .queueitem.done { opacity: 0.6; cursor: default; }
  .queueitem.done:hover { background: none; }
  .queueitem svg { flex: none; margin-top: 2px; color: var(--color-neutral-700); }
  .queueitem.now svg { color: var(--color-accent-800); }
  .queueitem.done svg { color: var(--color-accent-700); }
  .queuetitle { font-size: 14px; line-height: 1.45; }
  .queueitem.now .queuetitle { font-weight: 500; }
  .queueitem.done .queuetitle { text-decoration: line-through; }
  .queuesub { font: 500 11px/1 var(--font-mono); letter-spacing: 0.08em; color: var(--color-neutral-700); margin-top: 3px; }
  .queueitem.now .queuesub { color: var(--color-accent-800); }

  .decisionbox { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; background: var(--color-accent-100); }
  .decisionbox p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--color-accent-900); }

  .radio { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14.5px; min-height: 44px; }
  .radio .dot { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 1.5px solid var(--color-divider); }
  .radio input { position: absolute; opacity: 0; width: 0; height: 0; }
  .radio:hover .dot { border-color: var(--color-accent); }
  .radio input:checked + .dot { border-color: var(--color-accent); background: var(--color-accent);
    box-shadow: inset 0 0 0 4px var(--color-bg); }
  .radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .factpick { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; cursor: pointer; }

  /* parsed-section confirm list */
  .parsedlist { display: flex; flex-direction: column; gap: 8px; }
  .parsedrow { display: flex; gap: 11px; align-items: flex-start; padding: 11px 13px; }
  .parsedrow input { margin-top: 5px; flex: none; }
  .parsedrow .pbody { display: flex; flex-direction: column; gap: 3px; }
  .parsedrow .pq { font-size: 0.88rem; color: var(--color-neutral-700); }
  .pillrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .gapmark { color: var(--color-flag); font-weight: 600; }
  .fallbacknote { color: var(--color-neutral-700); font-size: 0.85rem; font-style: italic; }
  .evidence { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .evidence .evrow { display: flex; gap: 10px; align-items: baseline; font-size: 0.9rem; }

  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: var(--space-2); border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent); vertical-align: top; }
  th { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 60%, transparent);
    border-bottom: 1px solid var(--color-divider); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

  .banner { border: 1px solid var(--color-divider); padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .banner.warn { border-color: var(--color-flag); background: var(--color-flag-bg); }
  .errline { color: var(--color-danger); font-size: 0.9rem; }

  ul.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
  hr, .hr { border: none; border-top: 1px solid var(--color-divider); margin: 6px 0; height: 1px; background: var(--color-divider); }
  .filerow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type="file"] { font: inherit; font-size: 0.9rem; color: var(--color-neutral-700); max-width: 100%; }

  /* ---- voice ---- */
  .voicepanel { padding: 26px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .miclarge { width: 66px; height: 66px; padding: 0; border-radius: 0; }
  .ortype { display: flex; align-items: center; gap: 14px; }
  .ortype .rule { flex: 1; height: 1px; background: var(--color-divider); }
  .waveform { display: flex; align-items: flex-end; gap: 3px; height: 46px; justify-content: center; }
  .waveform i { width: 3px; background: var(--color-accent-500); display: block; }
  .caret { color: var(--color-accent); }
</style>

<div class="shell">
  <div id="app" aria-live="polite"></div>
</div>

<script>
"use strict";

/* ============================================================
   Grant Narrative Interviewer

   Two layers, deliberately separate:
     - The FUNDER'S application decides the structure: which
       sections exist, their wording, their order, word limits.
     - OUR criteria library decides the rigor: the concrete bar
       each answer has to clear before it's recorded as a fact.

   Mirroring a funder's questions alone would lose the pushing-
   for-specifics that is the whole point (funders often ask
   vague things). Imposing our own fixed sections misses what
   they actually require. So: their container, our standard.

   Everything downstream — the follow-up ladder, consistency
   checks, grounding validation, Resolution Pass, evidence
   table — is section-agnostic and unchanged by this.
   ============================================================ */

/* ---------- criteria library: our research-grounded bars ---------- */

/**
 * The rigor library. Each criterion carries five pieces:
 *
 *   label     Human-readable section name.
 *   bar       What an answer must contain to be recorded as a fact.
 *   rephrase  A gentler restatement, shown on a second failed attempt.
 *   why       "Why reviewers care" — shown above the input, before the ask.
 *   coach     Criterion-specific guidance for the model when an answer misses:
 *             what leaders usually DO bring, and the one thing usually absent.
 *
 * `coach` exists because a single generic "ask what's missing" instruction
 * produced the same unhelpful nudge for all twelve questions, and live testing
 * showed two answers rejected three times each on text that was genuinely
 * close. Naming the typical gap per criterion gives the model something
 * specific to probe instead of restating the bar back at the leader.
 *
 * A criterion may instead define `multi` (an array of sub-probes) plus
 * `leadBar`; see probesFor() for how those expand.
 */
const CRITERIA = {
  FIT: {
    label: "Funder Fit",
    bar: "names a specific stated funder priority plus the mechanism connecting the project to it",
    rephrase: "Pick one priority from the funder's own language and say the sentence that connects it to what you're doing.",
    why: "Some funders screen out misaligned applications before a reviewer reads the narrative.",
    coach: "Leaders almost always name the funder's priority correctly and know their program belongs. What's usually missing is the MECHANISM — asserting the program fits, rather than saying what the program actually does that produces the funder's priority. Ask about the connecting step, not about the priority.",
  },
  ORG: {
    label: "Organization Background",
    bar: "how long operating + size (staff or budget) + what the organization actually does",
    rephrase: "How many years, how many staff or what budget, and what are your main programs?",
    why: "Reviewers place your project against the organization behind it.",
    coach: "Leaders describe what the organization does fluently. What's usually missing is one of the three concrete anchors — years operating, staff or budget size. Ask for whichever is absent.",
  },
  SIGNIFICANCE: {
    label: "Problem & Evidence",
    bar: "population + a number, data source, or direct experience + a named barrier",
    rephrase: "Do you have a number or a data source showing the scale? What's actually stopping people?",
    why: "“X is a major problem” without a population, a number, and a barrier gives a reviewer nothing to trust.",
    coach: "Leaders know this problem first-hand and can describe who it affects. Usually one of three is missing: the population, a number or source, or the BARRIER — what specifically stops people from getting help now. Ask for the one that's absent, and note direct program experience counts as evidence if they name it as such.",
  },
  OBJECTIVES: {
    label: "Objective",
    bar: "specific, bounded, explainable after one read",
    rephrase: "If I could remember only one sentence about this project, what should it be?",
    why: "A reviewer has to be able to explain your project to the panel after one read.",
    coach: "Leaders can describe the project at length. What's usually missing is compression and bounding — no timeframe, or several objectives bundled into one. Ask them to pick the single one that matters and bound it.",
  },
  APPROACH: {
    label: "Activities & Approach",
    bar: "sequenced activities plus explicit reasoning for why they produce the outcome",
    rephrase: "Why do you expect that specific activity to lead to that specific result?",
    why: "Attractive activities without the “why this works” chain is where proposals lose reviewers.",
    coach: "Leaders list activities in order easily — this is their design work and they know it well. What's usually thin is the CAUSAL CHAIN: which specific activity produces the outcome, and by what step. A gestural link (\"that's what moves the needle\") names the activity but not the mechanism. Ask what happens for a participant between the activity and the result.",
  },
  RISK: {
    label: "Risk & Mitigation",
    bar: "one named risk with a stated mitigation or fallback",
    rephrase: "If your best-case assumption doesn't hold, what's the fallback?",
    why: "Naming a real risk with a plan signals competence; “we anticipate no difficulties” signals the opposite.",
    coach: "Leaders know their real operational risks. What's usually missing is the paired mitigation, or the risk named is generic rather than specific to this project. Ask what they'd actually do the week it happened.",
  },
  TEAM: {
    label: "Team & Capacity",
    bar: "named roles plus a real number (years, sites, dollars managed, retention)",
    rephrase: "Who leads this, and can you give me a number that backs up the track record?",
    why: "Demonstrate capability, don't assert it: “12 sites over 5 years” convinces; “uniquely qualified” doesn't.",
    coach: "Leaders know exactly who does this work and trust them for good reason. What's usually missing is the NUMBER that makes the track record checkable — years, sites, people served, dollars managed. Ask for one number attached to the person or team they already named.",
  },
  OUTCOMES: {
    label: "Measurable Outcomes",
    leadBar: "a specific, concrete answer to what was asked — a number, a named measure, or a named source",
    coach: "Leaders can describe the change they see in participants. What's usually missing is translating that into something countable. Ask what they'd observe or record that would show the change, not whether the change is real.",
    multi: [
      { key: "indicator", q: "What's the main indicator you'll track?",
        bar: "a named, trackable indicator",
        rephrase: "What number would tell you this worked?",
        why: "“500 attended” shows reach, not effect." },
      { key: "baseline", q: "What's the current baseline for that?",
        bar: "a starting value, or an explicit statement that no baseline exists yet",
        rephrase: "Even a rough starting point helps — what's it at today?",
        why: "A target without a starting point can't show progress. “No baseline yet” is a legitimate answer." },
      { key: "target_timing", q: "What's your target, and by when?",
        bar: "a target value with a date or period",
        rephrase: "By the end of the grant period, what number are you aiming for?",
        why: "Indicator + baseline + target + date is the shape reviewers read as a real commitment." },
      { key: "data_source", q: "How will you measure it — what's the data source?",
        bar: "a named data source or measurement method",
        rephrase: "What record or system will you pull that number from?",
        why: "A named source separates a measured outcome from a hopeful one." },
    ],
  },
  REACH: {
    label: "People Served",
    bar: "a number of people, and who they are",
    rephrase: "Roughly how many people, and which group?",
    why: "Reviewers read this as scale, separate from whether the work changed anything.",
    coach: "Leaders know who they serve. What's usually missing is just a count, or which group the count refers to. An estimate is acceptable if they say it's an estimate — ask for the rough number.",
  },
  EVALUATION: {
    label: "Evaluation Plan",
    bar: "a named data system + who reviews it + how often",
    rephrase: "What system holds the data, who looks at it, and on what schedule?",
    why: "Funders distinguish “we'll evaluate” from a plan with a system, an owner, and a cadence.",
    coach: "Leaders usually already review their data informally — in staff meetings, at year-end. What's missing is naming that existing rhythm: the system, the person, the cadence. Ask about what they already do, not what they should start doing.",
  },
  BUDGET: {
    label: "Budget",
    bar: "allocation explainable against the activities described",
    rephrase: "Which line item covers the activity you called central?",
    why: "The budget is a numerical version of the plan; reviewers check the two agree.",
    coach: "Leaders know what the money pays for. What's usually missing is the mapping back to a specific activity they already described. Ask which line covers the activity they called central.",
  },
  SUSTAINABILITY: {
    label: "Sustainability",
    bar: "a specific mechanism or decision point, not just an intention to seek more funding",
    rephrase: "What specifically happens at the end of the grant year — what gets decided, by whom, using what?",
    why: "“We'll pursue future funding” is the most common non-answer in this section.",
    coach: "Leaders have real plans here but describe them as intentions (\"we'll seek more funding\"). What's missing is the DECISION POINT — who decides what, when, using which information. Ask what happens in the last month of the grant.",
  },
  IMPACT: {
    label: "Impact",
    bar: "names a mechanism or next step, not just a magnitude claim",
    rephrase: "What's the next step after this grant period that gets you toward the bigger change?",
    why: "“Could transform X” adds nothing without the pathway.",
    coach: "Leaders have a genuine long-term vision for this work. What's usually missing is the immediate NEXT STEP that connects this grant to it. Ask what happens right after this grant period ends, not what the vision is.",
  },
  OTHER: {
    label: "Other",
    bar: "a specific, concrete answer with names, numbers, or dates where they apply",
    rephrase: "Can you make that more specific — a number, a name, or a date?",
    why: "This section comes from the funder's own application.",
    coach: "Ask for the single most useful specific the answer is missing — a name, a number, or a date — rather than asking for more detail generally.",
  },
};

/* Default set, used when no application document is supplied. */
const DEFAULT_CRITERIA_ORDER = ["FIT", "SIGNIFICANCE", "OBJECTIVES", "APPROACH", "RISK", "TEAM", "OUTCOMES", "BUDGET", "IMPACT"];

const DEFAULT_QUESTIONS = {
  FIT: "Which of this funder's stated priorities does your project advance, and how?",
  SIGNIFICANCE: "What specific problem, for whom, and why does it need action now?",
  OBJECTIVES: "One sentence: what will you accomplish, for whom, doing what, producing what result?",
  APPROACH: "Walk me through the activities in order, and why you believe they'll produce that outcome.",
  RISK: "What's most likely to go wrong, and what would you do about it?",
  TEAM: "Who's doing this, and what's their actual track record?",
  BUDGET: "Roughly how does the ask map to the activities you described?",
  IMPACT: "If this succeeds, what changes beyond the outcome — and what's the path from here to there?",
};

/**
 * Expand a criterion into the ordered probes a section will ask.
 *
 * @param {string} criterion   Key into CRITERIA (falls back to OTHER).
 * @param {string} [question]  The funder's own wording, when an application
 *                             was parsed. Always leads when present.
 * @param {string} [customBar] Overrides the criterion's default bar.
 * @returns {Array<{key: string, question: string, bar: string,
 *                  rephrase: string, why: string, coach: string}>}
 */
function probesFor(criterion, question, customBar) {
  const c = CRITERIA[criterion] || CRITERIA.OTHER;
  const coach = c.coach || CRITERIA.OTHER.coach;
  if (c.multi) {
    const subs = c.multi.map(m => ({
      key: m.key, question: m.q, bar: m.bar, rephrase: m.rephrase, why: m.why, coach,
    }));
    // A criterion that expands into several probes must never REPLACE the
    // funder's own question with our sub-questions. One real form asked "How
    // many people will be directly affected?"; mapping it to OUTCOMES swapped
    // in indicator/baseline/target/source and the headcount was never asked,
    // so the funder's question went unanswered in the draft. When the funder
    // supplies a question, it leads — our sub-probes refine it.
    if (question) {
      const lead = {
        key: "funder", question, bar: c.leadBar || subs[0].bar,
        rephrase: subs[0].rephrase, why: subs[0].why, coach,
      };
      return [lead, ...subs.filter(s => s.key !== subs[0].key)];
    }
    return subs;
  }
  return [{
    key: "main",
    question: question || DEFAULT_QUESTIONS[criterion] || `Tell me about: ${c.label}`,
    bar: customBar || c.bar,
    rephrase: c.rephrase,
    why: c.why,
    coach,
  }];
}

/**
 * The standard grant sections, used when no funder application is supplied.
 * @returns {Array<object>} Section objects in DEFAULT_CRITERIA_ORDER.
 */
function defaultSections() {
  return DEFAULT_CRITERIA_ORDER.map(cr => ({
    key: cr.toLowerCase(),
    name: CRITERIA[cr].label,
    criterion: cr,
    warning: cr === "FIT",
    autoAssemble: false,
    wordLimit: null,
    probes: probesFor(cr, DEFAULT_QUESTIONS[cr]),
  }));
}

/* ---------- state ---------- */

/**
 * The single mutable store for one interview. Everything the UI renders is
 * derived from this; there is no second source of truth.
 *
 * Durable fields survive a reload (see checkpoint). Transient fields are
 * per-attempt UI state and are deliberately dropped on save — see
 * TRANSIENT_KEYS below for why.
 *
 * @property {string} phase              welcome | confirm | interview | resolution | drafting | output
 * @property {?Array} sections           Live interview structure (parsed from the
 *                                       funder's application, or DEFAULT).
 * @property {?object} parsed            Candidate sections awaiting confirmation.
 * @property {Object<string,object>} facts            Recorded facts, keyed by id.
 * @property {Object<string,object>} gaps             Unanswered probes, keyed by id.
 * @property {Object<string,object>} inconsistencies  Raised flags, keyed by id.
 * @property {Object<string,object>} resolutions      Leader decisions, keyed by flag/gap id.
 * @property {number} counter            Monotonic id source; see nextId.
 * @property {number} sectionIdx         Cursor: which section.
 * @property {number} probeIdx           Cursor: which probe within it.
 * @property {number} attempts           Failed attempts on the current probe (0-2; 3 gaps it).
 * @property {string} funderPriorities   The funder's own words, pulled or pasted.
 * @property {?string} funderName        Funder name, when the application states one.
 * @property {?Object<string,number>} budgetLines  Parsed budget, if supplied.
 * @property {?string} coachNote         Transient: what's still needed on a miss.
 * @property {?string} coachStrength     Transient: what the leader already brought.
 * @property {?string} lastAttemptText   Transient: their text, restored into the box.
 * @property {?string} autoGapNotice     Transient: one-shot banner after an auto-gap.
 * @property {?Array} drafts             Assembled sections; rebuilt on resume.
 * @property {string[]} resolveQueue     Flag/gap ids awaiting a decision.
 * @property {number} resolveIdx         Cursor into resolveQueue.
 * @property {Object<string,boolean>} approvals  Section key -> approved by leader.
 */
const state = {
  phase: "welcome",
  sections: null,
  parsed: null,
  facts: {}, gaps: {}, inconsistencies: {}, resolutions: {},
  counter: 0,
  sectionIdx: 0, probeIdx: 0, attempts: 0,
  funderPriorities: "",
  funderName: null,
  budgetLines: null,
  coachNote: null,
  coachStrength: null,
  lastAttemptText: null,
  autoGapNotice: null,
  drafts: null,
  resolveQueue: [], resolveIdx: 0,
  approvals: {},
};

/** Mint a unique id for a fact, gap or flag. @param {string} p prefix */
const nextId = (p) => `${p}-${++state.counter}`;

const SAVE_KEY = "gna.session.v2";

/** The live structure, falling back to the standard sections. */
const getSections = () => state.sections || defaultSections();

/**
 * Per-attempt UI state, dropped on save as a group.
 *
 * These four describe one in-flight answer, not the interview's progress.
 * Persisting any of them alone splits a pair that only makes sense together:
 * a restored coachStrength without its coachNote would show what the leader
 * brought with no statement of what's still missing — precisely the
 * affirmation-without-verdict failure the two-field split exists to prevent.
 * `drafts` is excluded separately (large, and regenerated on resume);
 * `parsed` is excluded because confirmation is not resumable mid-flight.
 */
const TRANSIENT_KEYS = ["coachNote", "coachStrength", "lastAttemptText", "autoGapNotice"];

/**
 * Persist the session to localStorage. Silent no-op where storage is
 * unavailable (private windows, blocked site data) — saving is a
 * convenience, never a correctness requirement.
 */
function checkpoint() {
  try {
    const keep = {};
    for (const [k, v] of Object.entries(state)) {
      if (k === "drafts" || k === "parsed" || TRANSIENT_KEYS.includes(k)) continue;
      keep[k] = v;
    }
    // "output" is not resumable as-is: drafts were dropped above, so a resume
    // re-enters drafting and rebuilds them from the same resolved facts.
    if (keep.phase === "output") keep.phase = "drafting";
    localStorage.setItem(SAVE_KEY, JSON.stringify(keep));
  } catch (e) { /* storage unavailable */ }
}

/** Discard any saved session. */
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/**
 * Read a resumable session, or null when there is nothing worth resuming.
 * @returns {?object} Saved state, never a welcome-phase stub.
 */
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    return (data && data.phase && data.phase !== "welcome") ? data : null;
  } catch (e) { return null; }
}

/* ---------- deterministic checks ---------- */

const TOLERANCE = 0.02;
const NUMBER_RE = /-?\d[\d,]*\.?\d*/g;

/**
 * Every distinct number appearing in a string, comma separators tolerated.
 * @param {string} text
 * @returns {Set<number>}
 */
function numbersIn(text) {
  const found = new Set();
  for (const m of String(text || "").match(NUMBER_RE) || []) {
    const v = parseFloat(m.replace(/,/g, ""));
    if (!Number.isNaN(v)) found.add(v);
  }
  return found;
}
/**
 * Every number a fact entitles the draft to state — from its structured
 * fields, its summary and the leader's verbatim wording.
 *
 * This is the allow-list the grounding check validates drafted prose
 * against: a number absent from this set was invented, and sends the
 * section to plain phrasing instead.
 *
 * @param {object} fact
 * @returns {Set<number>}
 */
function licensedNumbers(fact) {
  const vals = new Set();
  for (const v of Object.values(fact.structuredFields || {})) if (typeof v === "number") vals.add(v);
  for (const n of numbersIn(fact.summary)) vals.add(n);
  for (const n of numbersIn(fact.verbatim)) vals.add(n);
  return vals;
}
const normalizeMetric = (n) => String(n).trim().toLowerCase().replace(/[\s\-_]+/g, " ").trim();
const prettyMetric = (n) => String(n).replace(/[:_\-]+/g, " ").trim();
const sectionName = (key) => (getSections().find(s => s.key === key) || { name: key }).name;

/* A pair of facts can be noticed from either side as each is recorded, which
   produced two mirror-image flags for one disagreement. Key by the sorted
   pair so a pair is only ever flagged once. */
function alreadyFlagged(ids) {
  const key = [...ids].sort().join("|");
  return Object.values(state.inconsistencies).some(i => [...(i.relatedFactIds || [])].sort().join("|") === key);
}

/**
 * Deterministic, always-on contradiction check for one newly recorded fact.
 *
 * Free (no model call) and conservative by design: it only fires when two
 * facts name the same metric, in different sections, with no figure in
 * common and values further apart than TOLERANCE. Everything softer is left
 * to the background semantic pass.
 *
 * @param {object} newFact
 * @returns {?object} An inconsistency to record, or null.
 */
function checkInternalConsistency(newFact) {
  const nm = newFact.structuredFields?.metric_name;
  const nv = newFact.structuredFields?.value;
  if (nm == null || typeof nv !== "number") return null;
  for (const existing of Object.values(state.facts)) {
    if (existing.id === newFact.id) continue;
    // Sub-questions inside ONE section are facets of a single answer, and
    // people naturally restate their numbers across them ("38% today, aiming
    // for 65%" said again under baseline, target and data source). Comparing
    // within a section produced guaranteed false alarms — a baseline reading
    // as a contradiction of its own target. Real contradictions are the ones
    // that cross sections, and those are still caught.
    if (existing.section === newFact.section) continue;
    // Two answers that SHARE a figure are restating each other, not
    // disagreeing. One answer often carries several numbers ("38% today,
    // aiming for 65%"), and each fact records only one of them as its
    // value — so a funder that splits related questions across sections
    // produced 38-vs-65 "contradictions" out of two identical statements.
    // Comparing the whole set of figures, rather than one captured value,
    // holds however a form is structured.
    const shared = [...licensedNumbers(newFact)].some(n => licensedNumbers(existing).has(n));
    if (shared) continue;
    const em = existing.structuredFields?.metric_name;
    if (em == null) continue;
    if (normalizeMetric(em) !== normalizeMetric(nm)) continue;
    const er = existing.structuredFields?.metric_role, nr = newFact.structuredFields?.metric_role;
    if (er && nr && er !== nr) continue;
    const ev = existing.structuredFields?.value;
    if (typeof ev !== "number" || ev === 0) continue;
    if (Math.abs(nv - ev) / Math.abs(ev) > TOLERANCE) {
      if (alreadyFlagged([existing.id, newFact.id])) continue;
      return { id: nextId("inc"), criterion: newFact.criterion, kind: "internal",
        description: `You gave ${prettyMetric(nm)} as ${ev} in ${sectionName(existing.section)}, and as ${nv} in ${sectionName(newFact.section)}. If these describe the same thing, a reviewer will notice; if they're different measures, naming them separately keeps the draft clear.`,
        relatedFactIds: [existing.id, newFact.id] };
    }
  }
  return null;
}

/**
 * Flag activities the leader described that no pasted budget line covers.
 *
 * Reviewers read the budget as a numeric restatement of the plan, so a
 * central activity with no traceable allocation is a common scoring
 * deduction. One flag per distinct activity — repeats across sections were
 * pure noise. No-op when no budget was supplied.
 */
function runBudgetChecks() {
  if (!state.budgetLines) return;
  const seen = new Set();
  for (const fact of Object.values(state.facts)) {
    const activity = fact.structuredFields?.activity_name;
    if (!activity) continue;
    const norm = String(activity).trim().toLowerCase();
    // One flag per distinct activity: repeats across sections were pure noise.
    if (!norm || seen.has(norm)) continue;
    seen.add(norm);
    const hit = Object.entries(state.budgetLines).find(([cat]) => {
      const c = cat.toLowerCase();
      return c.includes(norm) || norm.includes(c);
    });
    let description = null;
    if (!hit) description = `You described "${activity}" as part of the work, but no line in the budget you pasted matches it. It may sit inside a broader category — reviewers check narrative-to-budget fit, so it's worth being able to say where.`;
    else if (hit[1] <= 0) description = `You described "${activity}" as part of the work, but its budget line is $${hit[1]}.`;
    if (description) {
      const inc = { id: nextId("inc"), criterion: "BUDGET", kind: "budget", description, relatedFactIds: [fact.id] };
      state.inconsistencies[inc.id] = inc;
    }
  }
}

/**
 * Parse pasted budget lines into category -> amount.
 *
 * Deliberately forgiving about shape: accepts comma, pipe or tab separated
 * rows, and markdown tables, because leaders paste straight out of a
 * spreadsheet or a document.
 *
 * @param {string} text
 * @returns {?Object<string,number>} null when nothing parsed.
 */
function parseBudgetText(text) {
  const lines = {};
  for (const row of String(text).split(/\r?\n/)) {
    const cleaned = row.replace(/^\s*\|/, "").replace(/\|\s*$/, "");
    const parts = cleaned.split(/[|,\t]/);
    if (parts.length < 2) continue;
    const cat = parts[0].replace(/[*_]/g, "").trim();
    if (!cat || /^-+$/.test(cat)) continue;
    if (/^(category|item|line item)$/i.test(cat)) continue;
    const amt = parseFloat(parts.slice(1).join("").replace(/[$,\s*_]/g, ""));
    if (!Number.isNaN(amt)) lines[cat] = amt;
  }
  return Object.keys(lines).length ? lines : null;
}

/* ---------- model calls ---------- */

let sampleFn = null;
let sampleDead = false;
const pendingChecks = [];

const CRITERION_NAMES = Object.keys(CRITERIA);

/**
 * Prompt that turns a funder's application into interview structure.
 *
 * Output is kept deliberately compact: a long application (17+ sections)
 * otherwise overruns the reply budget and the JSON is cut off mid-array.
 *
 * @param {string} text Extracted or pasted application text.
 * @returns {string} Prompt for sampleFn.json().
 */
function parseApplicationPrompt(text) {
  const excerpt = text.slice(0, 45000);
  return (
`Below is a grant application document — either a blank application/RFP listing the questions an applicant must answer, or a completed sample application. Identify the sections the applicant is required to write.

For each section, in the order the document presents them, return:
- "name": the funder's own heading, verbatim where possible
- "question": one plain-language interview question that would elicit that section's content, addressed to a nonprofit leader ("What...", "Who...", "How...")
- "criterion": the closest match from this list — ${CRITERION_NAMES.join(", ")} — or "OTHER" if none fit
- "wordLimit": a number if the document states a word or character limit for that section, otherwise null
- "autoAssemble": true ONLY for a section that summarizes other sections (an executive summary or abstract), which can be written from the other answers rather than asked about

Rules: include only sections the applicant writes — skip cover pages, instructions, attachment checklists, and signature blocks. Skip a budget TABLE itself (figures are collected separately), but DO include a budget narrative or justification section if the applicant has to write one. Use "criterion":"OUTCOMES" ONLY for a section asking how results will be MEASURED — an indicator, a baseline, a target, evidence of change. A question asking HOW MANY people will be served, reached, or affected is "REACH", not OUTCOMES. A question asking how progress will be tracked or reported is "EVALUATION". Do not invent sections the document doesn't ask for.

Also capture, if and only if the document states them:
- "funderName": the funding organization's name
- "funderPriorities": the funder's own statement of what they fund — their goals, priorities, mission, or the kind of work they support. Copy their wording VERBATIM, trimmed to the relevant sentences. This is often a short paragraph near the top of a form ("...grant goals: To promote...") or in an RFP's purpose section. If the document does not state what the funder is looking for, use null. Never infer, summarize, or invent it.

Keep the output compact — a long application can otherwise overrun the reply limit and be cut off mid-list. Keep every "question" under 20 words, and omit "wordLimit" and "autoAssemble" entirely unless they apply.

Reply with ONLY this JSON, no other text:
{"funderName":null,"funderPriorities":null,"sections":[{"name":"...","question":"...","criterion":"..."}]}

DOCUMENT:
"""
${excerpt}
"""`);
}

/**
 * Validate and normalize the parse result into usable section objects.
 *
 * Treats the literal string "null" and blank strings as absent rather than
 * as content, so a model that fills the template literally cannot put the
 * word "null" in front of the leader as the funder's priorities.
 *
 * @param {object} raw Parsed JSON from parseApplicationPrompt.
 * @returns {{sections: Array<object>, funderName: ?string, funderPriorities: ?string}}
 */
function normalizeParsed(raw) {
  const list = Array.isArray(raw?.sections) ? raw.sections : [];
  const out = [];
  const used = new Set();
  for (const s of list) {
    const name = String(s?.name || "").trim();
    if (!name) continue;
    let criterion = String(s?.criterion || "OTHER").toUpperCase();
    if (!CRITERIA[criterion]) criterion = "OTHER";
    let key = name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40) || "section";
    while (used.has(key)) key += "_x";
    used.add(key);
    const wl = Number(s?.wordLimit);
    out.push({
      key, name, criterion,
      warning: criterion === "FIT",
      autoAssemble: !!s?.autoAssemble,
      wordLimit: Number.isFinite(wl) && wl > 0 ? wl : null,
      probes: s?.autoAssemble ? [] : probesFor(criterion, String(s?.question || "").trim()),
    });
  }
  const str = (v) => (typeof v === "string" && v.trim() && v.trim().toLowerCase() !== "null") ? v.trim() : null;
  return { sections: out, funderName: str(raw?.funderName), funderPriorities: str(raw?.funderPriorities) };
}

/**
 * Narrative essentials this funder never asks about.
 *
 * Shown as context, not a warning to fix: different funders legitimately
 * want different things. BUDGET is deliberately excluded — figures arrive
 * through their own paste box regardless, so listing it would be a false
 * alarm.
 *
 * @param {Array<object>} sections
 * @returns {string[]} Human-readable criterion labels.
 */
function coverageGaps(sections) {
  const covered = new Set(sections.map(s => s.criterion));
  // BUDGET is deliberately absent: budget figures come in through their own
  // paste box whether or not the funder asks for a budget narrative, so
  // listing it as "not asked" would be a false warning.
  const important = ["SIGNIFICANCE", "OBJECTIVES", "APPROACH", "TEAM", "OUTCOMES"];
  return important.filter(c => !covered.has(c)).map(c => CRITERIA[c].label);
}

/**
 * Build the prompt that judges one answer against one probe's bar.
 *
 * On a miss the model returns TWO separate fields — `strength` and `note` —
 * rather than one blended sentence. That separation is structural, not
 * stylistic: a single field invites softening the verdict into the praise
 * ("great start, but..."), which is exactly the make-uncertainty-sound-settled
 * failure this tool exists to prevent. Keeping them apart means the miss stays
 * a miss no matter how warmly the strength is worded, and lets the UI render
 * them as two visually distinct things.
 *
 * `strength` must point at something actually present in the leader's reply,
 * and is null when nothing specific warrants it. Generic encouragement is
 * worse than none here.
 *
 * @param {object} section  The live section (name + criterion).
 * @param {object} probe    The current probe (question, bar, coach).
 * @param {string} reply    The leader's raw answer text.
 * @returns {string} Prompt for sampleFn.json().
 */
function classifyPrompt(section, probe, reply) {
  const known = [...new Set(Object.values(state.facts).map(f => f.structuredFields?.metric_name).filter(Boolean))];
  const funderCtx = (section.criterion === "FIT" && state.funderPriorities)
    ? `The funder's stated priorities: "${state.funderPriorities}"\n\n` : "";
  return (
`You are coaching a nonprofit leader through a structured grant-narrative interview.

This leader knows their community, their participants, and their program design better than any reviewer will. What they often lack is the specialized convention of grant writing — how to make what they already know legible and checkable to a funder. Treat every answer as coming from that expertise, and coach toward translation, never toward teaching them their own work.

${funderCtx}Section: "${section.name}"
Question asked: "${probe.question}"
What counts as concrete enough: ${probe.bar}.

Coaching guidance for this specific question: ${probe.coach}

The leader's reply:
"""
${reply}
"""

Judge two things: does the reply actually address the question asked, AND does it clear the bar? An answer that is detailed but about a different topic is a miss, not a fact. Partial credit is not a pass — but a reply that clears the bar in the leader's own plain wording IS a pass; do not hold out for polish, jargon, or extra detail the bar doesn't require.

Reply with ONLY one JSON object, no other text:
- Meets the bar and answers the question: {"decision":"fact","summary":"<one sentence capturing the fact>","verbatim_quote":"<the leader's own key wording, unedited>","structured_fields":{<see below>}}
- Otherwise: {"decision":"miss","strength":"<see below, or null>","note":"<see below>"}
- Leader explicitly gives up (doesn't know, has no data, asks to move on): {"decision":"give_up","reason":"<short reason>"}

On a miss, "strength" and "note" are two separate statements and must stay separate:
- "strength": one short sentence naming something SPECIFIC the leader already supplied in this reply — a named partner, a described sequence, a population they clearly know, a real operational risk. Quote or name the actual thing. If the reply contains nothing specific enough to name honestly, use null. Never write generic encouragement ("good start", "you're on the right track"), never praise the answer's completeness, and never soften or hedge the verdict here — this field says what they brought, not how close they got.
- "note": the coaching question itself, following the guidance above. Ask for the ONE missing piece the bar requires. Ask a real question the leader can answer from what they already know — not "add more detail", not a rewrite instruction, not a compliment.

structured_fields: include metric_name and value (a number) for a quantifiable claim. Include source_name if they named where a number comes from. Include activity_name ONLY for a single specific program activity that would plausibly carry its own budget line — never the organization or program's name, never a list, never a whole category.${known.length ? `\nMetric names already used: ${known.join(", ")}. If this reply is about one of those same quantities — even worded differently — reuse that EXACT metric_name. Only invent a new one for a genuinely different quantity.` : ""}`);
}

/**
 * Prompt that turns resolved facts into section prose.
 *
 * The constraints here are the product: no number, date or entity absent
 * from the facts; no inferred causation; no softening a precise figure into
 * vague language. Brevity is explicit because the drafting model otherwise
 * pads one fact into paragraphs, which is fatal against a word limit.
 *
 * Output is still validated against licensedNumbers() afterwards — this
 * prompt asks for grounding, assembleSection() enforces it.
 *
 * @param {Array<object>} facts Clean (non-overridden) facts for the section.
 * @param {object} section
 * @returns {string}
 */
function transformPrompt(facts, section) {
  const lines = facts.map(f => {
    let l = `- ${f.summary}`;
    if (f.structuredFields && Object.keys(f.structuredFields).length) l += ` (fields: ${JSON.stringify(f.structuredFields)})`;
    return l;
  }).join("\n");
  const limit = section?.wordLimit ? `\n- Keep it under ${section.wordLimit} words (the funder's limit for this section).` : "";
  return (
`Transform the following resolved facts into concise grant-narrative prose for the section "${section?.name || ""}" — usually one to three sentences. Rules, strictly:
- Do not add any number, date, or named entity that isn't in the facts below.
- Do not alter or combine facts into a claim not directly stated.
- Do not infer causation unless it's already in a fact's summary.
- Do not soften a precise number into vague language (never turn 118 into "most").
- Be brief: cover the facts once and stop. No restating a point in different words, no commentary on what it "underscores" or "reflects", no closing summary. Grant forms are tight on space and reviewers read padding as thin content.${limit}
- Output only the prose. No preamble, no meta-commentary.

Facts:
${lines}`);
}

/**
 * Background pass for contradictions the deterministic check cannot see:
 * the same quantity recorded under two different metric names.
 *
 * Runs without blocking the interview and stays silent unless the model
 * positively matches two claims. Candidates are pre-filtered by the same
 * same-section and shared-figure rules as checkInternalConsistency, so both
 * paths agree on what counts as a restatement rather than a disagreement.
 *
 * @param {object} newFact
 */
function queueSemanticCheck(newFact) {
  if (!sampleFn) return;
  const nm = newFact.structuredFields?.metric_name;
  const nv = newFact.structuredFields?.value;
  if (nm == null || typeof nv !== "number") return;
  const candidates = Object.values(state.facts).filter(f => {
    if (f.id === newFact.id) return false;
    if (f.section === newFact.section) return false; // same reason as the deterministic pass
    const m = f.structuredFields?.metric_name, v = f.structuredFields?.value;
    if (m == null || typeof v !== "number") return false;
    if (normalizeMetric(m) === normalizeMetric(nm)) return false;
    const r1 = f.structuredFields?.metric_role, r2 = newFact.structuredFields?.metric_role;
    if (r1 && r2 && r1 !== r2) return false;
    if (v !== 0 && Math.abs(nv - v) / Math.abs(v) <= TOLERANCE) return false;
    return true;
  });
  if (!candidates.length) return;
  const listing = candidates.map(f => `- metric_name="${f.structuredFields.metric_name}", value=${f.structuredFields.value}`).join("\n");
  const prompt =
`Do any of these already-recorded claims refer to the SAME underlying quantity as the new claim — not just a similar-sounding number? Different wordings of the same thing should match ("youth served" vs "young people served"). Genuinely different quantities must NOT match even if related ("students enrolled" vs "students who completed" are different).

New claim: metric_name="${nm}", value=${nv}

Already recorded:
${listing}

Reply with ONLY: {"match":"<matching metric_name copied exactly>"} or {"match":null}.`;
  const p = sampleFn.json(prompt, { modelTier: "quick" }).then(res => {
    const name = res && typeof res.match === "string" ? res.match : null;
    if (!name) return;
    const matched = candidates.find(f => f.structuredFields.metric_name === name);
    if (!matched) return;
    if (alreadyFlagged([matched.id, newFact.id])) return;
    const inc = { id: nextId("inc"), criterion: newFact.criterion, kind: "internal",
      description: `"${prettyMetric(matched.structuredFields.metric_name)}" (${matched.structuredFields.value}, in ${sectionName(matched.section)}) and "${prettyMetric(nm)}" (${nv}, in ${sectionName(newFact.section)}) look like the same thing under different names, with different values. You're the judge — they may genuinely be different measures.`,
      relatedFactIds: [matched.id, newFact.id] };
    state.inconsistencies[inc.id] = inc;
    checkpoint();
  }).catch(() => {});
  pendingChecks.push(p);
}

/**
 * Map a sampling failure to copy that tells the leader what to actually do.
 * @param {string} code Error code from the sample capability.
 * @returns {string}
 */
function samplingErrorCopy(code) {
  switch (code) {
    case "rate_limited": return "Claude is briefly rate-limited on your account. Wait a moment, then try again.";
    case "session_expired": return "Your Claude session expired — sign in again, then try again.";
    case "invalid_json": case "empty_completion": case "upstream_error":
      return "That didn't process cleanly. Your text is still here — try again.";
    case "refused": return "Claude declined to process that. Try rewording.";
    default: return "Claude access isn't available in this view.";
  }
}
const FATAL_SAMPLE_CODES = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"]);

/* ---------- interview engine ---------- */

function currentProbe() {
  const secs = getSections();
  while (state.sectionIdx < secs.length) {
    const section = secs[state.sectionIdx];
    if (!section.probes || !section.probes.length) { state.sectionIdx += 1; state.probeIdx = 0; continue; }
    if (state.probeIdx >= section.probes.length) { state.sectionIdx += 1; state.probeIdx = 0; continue; }
    return { section, probe: section.probes[state.probeIdx] };
  }
  return null;
}
/**
 * Move the cursor to the next probe, or the next section when the current
 * one is exhausted. Clears all per-attempt state, since it belongs to the
 * answer being left behind.
 */
function advance() {
  const secs = getSections();
  const section = secs[state.sectionIdx];
  state.probeIdx += 1; state.attempts = 0;
  state.coachNote = null; state.coachStrength = null; state.lastAttemptText = null;
  if (!section || state.probeIdx >= section.probes.length) { state.probeIdx = 0; state.sectionIdx += 1; }
}

/**
 * Record an answer that cleared the bar, then check it against what is
 * already on record.
 *
 * Tiering is mechanical: naming a source makes a fact "attributed", and
 * nothing else does. OUTCOMES baseline/target probes are tagged with a
 * metric_role so an intended baseline-to-target difference is never read as
 * a contradiction.
 *
 * @param {object} section
 * @param {object} probe
 * @param {object} parsed  The model's fact decision.
 * @param {string} reply   Raw answer, used as a fallback for summary/verbatim.
 */
function recordFact(section, probe, parsed, reply) {
  const sf = parsed.structured_fields && typeof parsed.structured_fields === "object" ? parsed.structured_fields : {};
  const fact = {
    id: nextId("fact"), section: section.key, criterion: section.criterion, probeKey: probe.key,
    summary: String(parsed.summary || reply), verbatim: String(parsed.verbatim_quote || reply),
    structuredFields: sf, tier: sf.source_name ? "attributed" : "unattributed", overridden: false,
  };
  if (section.criterion === "OUTCOMES" && (probe.key === "baseline" || probe.key === "target_timing"))
    if (!("metric_role" in fact.structuredFields))
      fact.structuredFields.metric_role = probe.key === "baseline" ? "baseline" : "target";
  if (fact.structuredFields.metric_name == null) {
    const nums = licensedNumbers(fact);
    if (nums.size) {
      fact.structuredFields.metric_name = `${section.key}:${probe.key}`;
      if (fact.structuredFields.value == null) fact.structuredFields.value = [...nums][0];
    }
  }
  state.facts[fact.id] = fact;
  const inc = checkInternalConsistency(fact);
  if (inc) state.inconsistencies[inc.id] = inc;
  else queueSemanticCheck(fact);
  advance(); checkpoint();
}

/**
 * Record a probe as unanswered.
 *
 * Carries the question and the leader's last attempt so the Resolve screen
 * can show what was actually asked and tried — a bare "needs a more
 * specific answer" arriving with no context left nothing to act on.
 *
 * @param {object} section
 * @param {object} probe
 * @param {string} reason        Funder-facing text; appears in the draft.
 * @param {string} [lastAttempt] What the leader wrote on the final try.
 */
function logGap(section, probe, reason, lastAttempt) {
  const gap = { id: nextId("gap"), section: section.key, criterion: section.criterion,
    probeKey: probe.key, reason, severity: section.warning ? "warning" : "gap",
    question: probe.question, lastAttempt: lastAttempt || null };
  state.gaps[gap.id] = gap;
  advance(); checkpoint();
}

/**
 * Judge one answer and advance, coach, or gap accordingly.
 *
 * Three failed attempts converts the probe to a gap rather than looping
 * forever. On attempts 1-2 the leader's text and the coaching pair are held
 * for redisplay; see TRANSIENT_KEYS.
 *
 * @param {string} reply
 * @throws Re-throws non-fatal sampling errors for the caller to surface.
 */
async function submitAnswer(reply) {
  const cur = currentProbe();
  if (!cur) return;
  const { section, probe } = cur;
  let parsed;
  try {
    parsed = await sampleFn.json(classifyPrompt(section, probe, reply));
  } catch (e) {
    if (FATAL_SAMPLE_CODES.has(e.code)) { sampleDead = true; render(); return; }
    throw e;
  }
  const decision = parsed && parsed.decision;
  if (decision === "fact") recordFact(section, probe, parsed, reply);
  else if (decision === "give_up") logGap(section, probe, String(parsed.reason || "You said you don't have this yet."));
  else {
    state.attempts += 1;
    if (state.attempts >= 3) {
      state.autoGapNotice = `Marked "${section.name}" as a gap after a few tries — you can revisit it on the Resolve screen.`;
      state.coachStrength = null;
      logGap(section, probe, "Needs a more specific answer.", reply);
    } else {
      // Keep what they typed on screen — losing it on a miss meant retyping
      // a whole paragraph from memory, which is the single biggest source
      // of friction this interview has.
      state.lastAttemptText = reply;
      // Held separately from coachNote and rendered as its own element, so a
      // verdict can never be softened into the affirmation. Null is a valid,
      // expected value: the model returns it when nothing specific in the
      // reply warrants naming.
      state.coachStrength = (parsed && typeof parsed.strength === "string" && parsed.strength.trim())
        ? parsed.strength.trim() : null;
      if (state.attempts === 2) state.coachNote = probe.rephrase;
      else state.coachNote = (parsed && parsed.note) ? String(parsed.note) : null;
    }
    checkpoint();
  }
  if (!currentProbe()) await finishInterview();
}

/** Record the current probe as an unanswered gap and move on. */
function skipCurrent() {
  const cur = currentProbe();
  if (!cur) return;
  logGap(cur.section, cur.probe, "Not answered yet.");
  if (!currentProbe()) finishInterview().then(render); else render();
}

/**
 * Close the interview: settle background checks, run budget checks, then
 * build the queue of everything awaiting a human decision.
 *
 * Skips straight to drafting when nothing needs resolving.
 */
async function finishInterview() {
  if (pendingChecks.length) await Promise.allSettled(pendingChecks);
  runBudgetChecks();
  state.resolveQueue = [
    ...Object.values(state.gaps).filter(g => !state.resolutions[g.id]),
    ...Object.values(state.inconsistencies).filter(i => !state.resolutions[i.id]),
  ].map(f => f.id);
  state.resolveIdx = 0;
  state.phase = state.resolveQueue.length ? "resolution" : "drafting";
  checkpoint();
  if (state.phase === "drafting") runDrafting();
}

/* ---------- resolution ---------- */

function coerceValue(raw) {
  const t = String(raw).trim().replace(/,/g, "").replace(/^\$/, "").replace(/%$/, "");
  const n = parseFloat(t);
  return (!Number.isNaN(n) && /^-?\d*\.?\d+$/.test(t)) ? n : raw;
}

/**
 * Apply the leader's decision on one flag or gap.
 *
 * The record of the flag is never erased, whatever the decision — an
 * override is preserved as "confirmed despite flag" in the evidence table,
 * because a reader deserves to see that the question was raised and
 * answered, not that it never existed.
 *
 * @param {string} flagId
 * @param {"corrected"|"explained"|"accepted"|"overridden"} resolution
 * @param {?string} updatedValue  Replacement text, for "corrected".
 * @param {?string} note          Leader's explanation, for "explained".
 * @param {?string} targetFactId  Which fact to act on, for two-fact flags.
 */
function applyResolution(flagId, resolution, updatedValue, note, targetFactId) {
  state.resolutions[flagId] = { resolution, updatedValue: updatedValue ?? null, note: note ?? null, targetFactId: targetFactId ?? null };
  const gap = state.gaps[flagId];
  if (gap) {
    if (resolution === "corrected" && updatedValue) {
      const fact = { id: nextId("fact"), section: gap.section, criterion: gap.criterion, probeKey: gap.probeKey,
        summary: String(updatedValue), verbatim: String(updatedValue),
        structuredFields: {}, tier: "attributed", overridden: false };
      state.facts[fact.id] = fact;
    } else if (resolution === "explained" && note) {
      gap.reason = `${gap.reason} (your note: ${note})`;
    }
    checkpoint(); return;
  }
  const inc = state.inconsistencies[flagId];
  if (!inc || !inc.relatedFactIds?.length) { checkpoint(); return; }
  const targetId = targetFactId && inc.relatedFactIds.includes(targetFactId)
    ? targetFactId : inc.relatedFactIds[inc.relatedFactIds.length - 1];
  const fact = state.facts[targetId];
  if (fact) {
    if (resolution === "corrected" && updatedValue) {
      fact.structuredFields.value = coerceValue(updatedValue);
      fact.summary = String(updatedValue); fact.tier = "attributed";
    } else if (resolution === "explained") { fact.structuredFields.resolution_note = note; }
    else if (resolution === "overridden") { fact.overridden = true; }
  }
  checkpoint();
}

/* ---------- draft assembly ---------- */

/* An overridden fact is inserted with the leader's own wording untouched —
   but appending it raw produced fragments mid-paragraph ("...goal of 65%.
   increasing this outcome from 38% to 65% Harbor Bridge will..."). Their
   words are preserved; only capitalisation and a closing period are added. */
function asSentence(text) {
  const s = String(text || "").trim();
  if (!s) return "";
  const capped = s.charAt(0).toUpperCase() + s.slice(1);
  return /[.!?]$/.test(capped) ? capped : capped + ".";
}

/* People restate the same figures across sub-questions of one section, which
   produced three near-identical facts (and three near-identical table rows)
   saying "38% to 65%". Collapse restatements within a section, keeping the
   fullest version. Conservative on purpose: only near-total overlap merges. */
function contentWords(s) {
  return new Set(String(s).toLowerCase().replace(/[^a-z0-9%$]+/g, " ").split(" ").filter(w => w.length > 2));
}
/**
 * Share of content words common to two strings, over the smaller set.
 * @returns {number} 0..1
 */
function overlapRatio(a, b) {
  const A = contentWords(a), B = contentWords(b);
  if (!A.size || !B.size) return 0;
  let shared = 0;
  for (const w of A) if (B.has(w)) shared++;
  return shared / Math.min(A.size, B.size);
}
const numbersKey = (s) => [...numbersIn(s)].sort((a, b) => a - b).join(",");

/* Two answers are a restatement of each other when they're in the SAME
   section and either read almost identically, or carry exactly the same set
   of figures with clear topical overlap. Wording alone wasn't enough: the
   real case that shipped ("...moving from a 38% baseline to a 65% goal" vs
   "...baseline is 38%, with a target of 65%") shares only 60% of its words
   but is plainly the same fact — the matching {38, 65} is the giveaway.
   Cross-section similarity never merges; that would delete a real answer. */
function isRestatement(a, b) {
  if (a.section !== b.section) return false;
  const words = overlapRatio(a.summary, b.summary);
  if (words >= 0.85) return true;
  const ka = numbersKey(a.summary);
  return !!ka && ka === numbersKey(b.summary) && words >= 0.45;
}

/**
 * Collapse facts that restate each other, keeping the fullest wording.
 * @param {Array<object>} facts
 * @returns {Array<object>}
 */
function dedupeFacts(facts) {
  const out = [];
  for (const f of facts) {
    const i = out.findIndex(g => isRestatement(f, g));
    if (i === -1) out.push(f);
    else if (contentWords(f.summary).size > contentWords(out[i].summary).size) out[i] = f;
  }
  return out;
}

/**
 * Gaps still standing for a section — a gap the leader corrected became a
 * real fact and no longer renders as a placeholder.
 * @param {string} sectionKey
 * @returns {Array<object>}
 */
function gapsForSection(sectionKey) {
  return Object.values(state.gaps).filter(g => {
    if (g.section !== sectionKey) return false;
    const r = state.resolutions[g.id];
    return !r || r.resolution !== "corrected";
  });
}

/**
 * Build one section's prose from its resolved facts.
 *
 * The grounding guarantee lives here: drafted prose is accepted only if
 * every number in it appears in licensedNumbers() for the facts behind it.
 * Anything else falls back to the leader's own plain sentences. Overridden
 * facts are appended verbatim, and unresolved gaps render as visible [GAP]
 * placeholders so nothing is submitted by accident.
 *
 * @param {object} section
 * @returns {Promise<{section: string, name: string, text: string,
 *                    fallback: boolean, wordLimit: ?number}>}
 */
async function assembleSection(section) {
  const all = Object.values(state.facts);
  const sectionFacts = dedupeFacts(section.autoAssemble ? all : all.filter(f => f.section === section.key));
  const clean = sectionFacts.filter(f => !f.overridden);
  const overridden = section.autoAssemble ? [] : sectionFacts.filter(f => f.overridden);
  const gaps = section.autoAssemble ? [] : gapsForSection(section.key);
  let body = "", fallback = false;

  if (clean.length) {
    const allowed = new Set();
    for (const f of clean) for (const n of licensedNumbers(f)) allowed.add(n);
    let prose = null;
    try { prose = (await sampleFn(transformPrompt(clean, section))).text; } catch (e) { prose = null; }
    if (prose && [...numbersIn(prose)].every(n => allowed.has(n))) body = prose.trim();
    else { fallback = true; body = clean.map(f => f.summary.replace(/\.*$/, ".")).join(" "); }
  }
  const parts = body ? [asSentence(body)] : [];
  for (const f of overridden) parts.push(asSentence(f.verbatim));
  for (const g of gaps) parts.push(`[GAP: ${g.reason}]`);
  return { section: section.key, name: section.name, text: parts.join(" "), fallback, wordLimit: section.wordLimit };
}

/**
 * Draft every section, then restore the funder's ordering.
 *
 * Auto-assembled sections (executive summaries) run last because they draw
 * on every recorded fact, including those from sections drafted after them
 * in the funder's order.
 */
async function runDrafting() {
  state.phase = "drafting"; render();
  const secs = getSections();
  const drafts = [];
  // auto-assembled sections (executive summaries) run last: they draw on every fact.
  const ordered = [...secs].sort((a, b) => (a.autoAssemble === b.autoAssemble) ? 0 : (a.autoAssemble ? 1 : -1));
  for (const section of ordered) {
    const el = document.getElementById("draftprogress");
    if (el) el.textContent = `Drafting ${section.name}… (${drafts.length + 1} of ${ordered.length})`;
    drafts.push(await assembleSection(section));
  }
  // restore the funder's own order for output
  const order = new Map(secs.map((s, i) => [s.key, i]));
  drafts.sort((a, b) => (order.get(a.section) ?? 0) - (order.get(b.section) ?? 0));
  state.drafts = drafts;
  state.phase = "output";
  checkpoint(); render();
}

/**
 * Rows for the evidence table: every fact, gap and flag with its tier and
 * resolution state.
 *
 * This is the artifact a leader would show a board, so it shows what is
 * covered rather than whether it is convincing.
 *
 * @returns {Array<object>}
 */
function buildTable() {
  const rows = [];
  for (const f of dedupeFacts(Object.values(state.facts)))
    rows.push({ criterion: f.criterion, section: sectionName(f.section), summary: f.summary,
      tier: f.tier, status: f.overridden ? "kept despite flag" : "resolved", flagged: f.overridden });
  for (const g of Object.values(state.gaps)) {
    const r = state.resolutions[g.id];
    rows.push({ criterion: g.criterion, section: sectionName(g.section), summary: g.reason,
      tier: "—", status: r ? `gap (${r.resolution})` : "gap (unresolved)", flagged: true });
  }
  for (const inc of Object.values(state.inconsistencies)) {
    const r = state.resolutions[inc.id];
    const secs = [...new Set((inc.relatedFactIds || []).map(id => state.facts[id]).filter(Boolean).map(f => sectionName(f.section)))];
    rows.push({ criterion: inc.criterion, section: secs.join(" / ") || inc.kind, summary: inc.description,
      tier: "—", status: r ? `flag (${r.resolution})` : "flag (unresolved)", flagged: true });
  }
  return rows;
}

/* A scaffold should leave the leader with more than a better draft — some of
   what it noticed should be usable outside this one application. This is
   deliberately deterministic (counts and groupings of the leader's own
   gaps/flags), never a model-generated "insight": the same no-invented-
   content rule that governs the draft applies here too. */
function reflectionInsights() {
  const notes = [];
  const gaps = Object.values(state.gaps);
  const flags = Object.values(state.inconsistencies);

  if (gaps.length) {
    const names = [...new Set(gaps.map(g => sectionName(g.section)))];
    notes.push(`You left ${gaps.length} section${gaps.length === 1 ? "" : "s"} as a gap: ${names.join(", ")}. That's often where a program does the work but hasn't formalized how to measure or evidence it yet.`);
  }

  const outcomeProbes = new Set(["indicator", "baseline", "target_timing", "data_source"]);
  const outcomeGaps = gaps.filter(g => outcomeProbes.has(g.probeKey));
  if (outcomeGaps.length) {
    notes.push(`${outcomeGaps.length} of those came from measuring results. Worth building a baseline and a named data source into how you track this program day to day, not just into this one application.`);
  }

  const budgetFlags = flags.filter(f => f.kind === "budget");
  if (budgetFlags.length) {
    notes.push(`${budgetFlags.length} flag${budgetFlags.length === 1 ? "" : "s"} came from an activity with no matching budget line. Worth checking your budget categories map cleanly to what you actually do — this will come up again in your next application too.`);
  }

  const internalFlags = flags.filter(f => f.kind === "internal");
  if (internalFlags.length) {
    notes.push(`${internalFlags.length} flag${internalFlags.length === 1 ? "" : "s"} came from your own numbers not lining up across sections. Worth a quick gut-check with whoever tracks that data outside this tool.`);
  }

  return notes;
}

/**
 * The full export: narrative, then evidence table.
 * @returns {string} Markdown.
 */
function draftAsMarkdown() {
  let out = "# Grant Narrative Draft\n\n_Assembled only from facts you stated and approved. Review every [GAP] before submitting. This tool cannot verify whether an outcome or impact claim is true._\n\n";
  for (const d of state.drafts) out += `## ${d.name}\n\n${d.text || "(nothing recorded for this section)"}\n\n`;
  out += "\n## Evidence Table\n\n_Shows what's covered, not whether it's convincing._\n\n| Area | Section | Item | Evidence tier | Status |\n|---|---|---|---|---|\n";
  for (const r of buildTable()) out += `| ${r.criterion} | ${r.section} | ${r.summary.replace(/\|/g, "\\|")} | ${r.tier} | ${r.status} |\n`;
  return out;
}

/* ---------- file reading ---------- */

/* ---------- PDF text extraction (inlined; see pdftext.js + test_pdftext.mjs)

   Minimal PDF text extractor — no dependencies.

   Written rather than pulled from a CDN for one reason: it can be tested
   against real funder PDFs in Node before shipping, whereas a library
   loaded inside the artifact sandbox can't be verified until it's live.

   Handles what funder application forms actually use: FlateDecode streams,
   page content text operators (Tj/TJ/'/"), and — critically — /ToUnicode
   CMaps, without which subset-embedded fonts extract as shifted gibberish
   (a real fillable form we tested came out with every character offset
   by 29). Scanned/image-only PDFs have no text layer at all; those are
   detected and reported rather than returned as noise.

   `inflate` is injected so Node (zlib) and the browser
   (DecompressionStream) can share the same code path. */

function latin1(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return s;
}

/**
 * Index every `N 0 obj ... endobj` body in the file by object number.
 * @param {string} raw Latin-1 view of the PDF bytes.
 * @returns {Map<number,{body: string, start: number, end: number}>}
 */
function findObjects(raw) {
  const objs = new Map();
  const re = /(\d+)\s+\d+\s+obj\b/g;
  let m;
  while ((m = re.exec(raw))) {
    const start = m.index + m[0].length;
    const end = raw.indexOf("endobj", start);
    if (end === -1) continue;
    objs.set(Number(m[1]), { body: raw.slice(start, end), start, end });
  }
  return objs;
}

/**
 * The raw bytes between `stream` and `endstream` for one object.
 * @returns {?Uint8Array}
 */
function streamBytes(bytes, raw, obj) {
  const sIdx = raw.indexOf("stream", obj.start);
  if (sIdx === -1 || sIdx > obj.end) return null;
  let p = sIdx + 6;
  if (raw[p] === "\r") p++;
  if (raw[p] === "\n") p++;
  let e = raw.indexOf("endstream", p);
  if (e === -1) return null;
  let end = e;
  while (end > p && (raw[end - 1] === "\n" || raw[end - 1] === "\r")) end--;
  return bytes.subarray(p, end);
}

/**
 * Decode one object's stream, inflating FlateDecode.
 * Returns null for image filters (DCT/CCITT) and anything unsupported —
 * those carry no text layer worth reading.
 * @returns {Promise<?string>}
 */
async function decodedStream(bytes, raw, obj, inflate) {
  const data = streamBytes(bytes, raw, obj);
  if (!data) return null;
  if (/\/Filter\s*(\/FlateDecode|\[\s*\/FlateDecode)/.test(obj.body)) {
    try { return latin1(await inflate(data)); } catch (e) { return null; }
  }
  if (/\/Filter/.test(obj.body)) return null; // DCT/CCITT image, or a filter we don't do
  return latin1(data);
}

/* ---- /ToUnicode CMap ---- */

function hexToChars(h) {
  let out = "";
  for (let i = 0; i + 3 < h.length + 1; i += 4) {
    const cp = parseInt(h.slice(i, i + 4), 16);
    if (!Number.isNaN(cp)) out += String.fromCharCode(cp);
  }
  return out;
}

/**
 * Parse a /ToUnicode CMap into code -> character.
 *
 * Without this, subset-embedded fonts extract as shifted gibberish: one
 * real fillable form came out with every character offset by 29, which
 * would have been fed to the parser as if it were the funder's questions.
 *
 * @param {string} text Decoded CMap stream.
 * @returns {{map: Map<number,string>, widest: number}} widest is 1 or 2 bytes.
 */
function parseCMap(text) {
  const map = new Map();
  let widest = 1;
  for (const blk of text.match(/beginbfchar([\s\S]*?)endbfchar/g) || []) {
    for (const m of blk.matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g)) {
      map.set(parseInt(m[1], 16), hexToChars(m[2]));
      if (m[1].length > 2) widest = 2;
    }
  }
  for (const blk of text.match(/beginbfrange([\s\S]*?)endbfrange/g) || []) {
    for (const m of blk.matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(<([0-9A-Fa-f]+)>|\[([\s\S]*?)\])/g)) {
      const lo = parseInt(m[1], 16), hi = parseInt(m[2], 16);
      if (m[1].length > 2) widest = 2;
      if (m[4] !== undefined) {
        const base = m[4];
        for (let c = lo; c <= hi && c - lo < 65536; c++) {
          const shifted = (parseInt(base.slice(-4), 16) + (c - lo)).toString(16).padStart(4, "0");
          map.set(c, hexToChars(base.slice(0, -4) + shifted));
        }
      } else {
        const items = [...m[5].matchAll(/<([0-9A-Fa-f]+)>/g)];
        items.forEach((it, i) => map.set(lo + i, hexToChars(it[1])));
      }
    }
  }
  return { map, widest };
}

/**
