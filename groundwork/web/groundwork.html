 * Build a character map per font object, keyed by object number.
 * Fonts without a /ToUnicode entry map to null and decode as-is.
 * @returns {Promise<Map<number,?object>>}
 */
async function buildFontMaps(bytes, raw, objs, inflate) {
  const fonts = new Map(); // font object number -> {map, widest}
  for (const [num, obj] of objs) {
    if (!/\/Type\s*\/Font/.test(obj.body)) continue;
    const tu = obj.body.match(/\/ToUnicode\s+(\d+)\s+\d+\s+R/);
    if (!tu) { fonts.set(num, null); continue; }
    const cmapObj = objs.get(Number(tu[1]));
    if (!cmapObj) { fonts.set(num, null); continue; }
    const text = await decodedStream(bytes, raw, cmapObj, inflate);
    fonts.set(num, text ? parseCMap(text) : null);
  }
  return fonts;
}

/* ---- content stream text ---- */

function decodeString(str, font) {
  if (!font || !font.map.size) return str;
  let out = "";
  const step = font.widest === 2 ? 2 : 1;
  for (let i = 0; i < str.length; i += step) {
    const code = step === 2
      ? (str.charCodeAt(i) << 8) | (str.charCodeAt(i + 1) || 0)
      : str.charCodeAt(i);
    const mapped = font.map.get(code);
    out += mapped !== undefined ? mapped : (step === 1 ? str[i] : "");
  }
  return out;
}

/**
 * Resolve PDF string escapes, including octal, to plain text.
 * @param {string} s
 * @returns {string}
 */
function unescapePdfString(s) {
  return s.replace(/\\([nrtbf()\\]|[0-7]{1,3})/g, (m, g) => {
    if (g === "n" || g === "r") return " ";
    if (g === "t") return " ";
    if (g === "b" || g === "f") return "";
    if (g === "(" || g === ")" || g === "\\") return g;
    return String.fromCharCode(parseInt(g, 8));
  });
}

const TOKEN_RE = /\/([A-Za-z0-9#+._-]+)\s+([\d.]+)\s+Tf|\(((?:\\.|[^\\()])*)\)\s*(?:Tj|')|<([0-9A-Fa-f\s]+)>\s*(?:Tj|')|\[((?:[^\][]|\[[^\]]*\])*)\]\s*TJ|(T\*)|([-\d.]+)\s+([-\d.]+)\s+(?:Td|TD)|((?:[-\d.]+\s+){4})([-\d.]+)\s+([-\d.]+)\s+Tm|([-\d.]+)\s+TL/g;

/**
 * Decode a hex-encoded PDF string into raw characters.
 * @param {string} h
 * @returns {string}
 */
function hexStr(h) {
  const hex = h.replace(/\s+/g, "");
  let s = "";
  for (let i = 0; i + 1 < hex.length; i += 2) s += String.fromCharCode(parseInt(hex.slice(i, i + 2), 16));
  return s;
}

/* Lines are decided by the text cursor's Y position alone — never by BT/ET.
   Real funder forms wrap EVERY fragment ("G", "rant ", "Requ") in its own
   BT...ET block at the same Y, so flushing on ET shattered the output into
   one word — sometimes one letter — per line. Same Y means same visual line;
   a meaningful Y change is a new one. A horizontal jump wider than the text
   could have advanced becomes a space, using a rough per-character width
   since we don't parse font metrics. */
function textFromContent(content, fontsByName) {
  const lines = [];
  let cur = "", font = null, size = 12;
  let x = 0, y = 0, lastY = null, penX = null, leading = 0;
  const flush = () => { const t = cur.replace(/\s+/g, " ").trim(); if (t) lines.push(t); cur = ""; };
  const advance = (text) => { if (penX !== null) penX += text.length * size * 0.6; };
  const moveTo = (nx, ny) => {
    if (lastY !== null && Math.abs(ny - lastY) > 2.5) flush();
    else if (cur && penX !== null && nx - penX > size * 0.45 && !cur.endsWith(" ")) cur += " ";
    x = nx; y = ny; lastY = ny; penX = nx;
  };
  const put = (text) => { cur += text; advance(text); };

  let m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(content))) {
    if (m[1] !== undefined) { font = fontsByName.get(m[1]) || null; size = Number(m[2]) || 12; continue; }
    if (m[3] !== undefined) { put(decodeString(unescapePdfString(m[3]), font)); continue; }
    if (m[4] !== undefined) { put(decodeString(hexStr(m[4]), font)); continue; }
    if (m[5] !== undefined) {
      for (const p of m[5].matchAll(/\(((?:\\.|[^\\()])*)\)|<([0-9A-Fa-f\s]+)>|(-?[\d.]+)/g)) {
        if (p[1] !== undefined) put(decodeString(unescapePdfString(p[1]), font));
        else if (p[2] !== undefined) put(decodeString(hexStr(p[2]), font));
        else if (Number(p[3]) < -180 && cur && !cur.endsWith(" ")) cur += " ";
      }
      continue;
    }
    if (m[6] !== undefined) { moveTo(x, y - (leading || size)); continue; }            // T*
    if (m[7] !== undefined) { moveTo(x + Number(m[7]), y + Number(m[8])); continue; }  // Td / TD
    if (m[10] !== undefined) { moveTo(Number(m[10]), Number(m[11])); continue; }       // Tm
    if (m[12] !== undefined) { leading = Math.abs(Number(m[12])) || size; continue; }  // TL
  }
  flush();
  return lines;
}

/* ---- page walk ---- */

function refsIn(s) { return [...s.matchAll(/(\d+)\s+\d+\s+R/g)].map(m => Number(m[1])); }

/* A dictionary value may be written inline (<< ... >>) or as an indirect
   reference to another object. Real forms use both — one fillable form we
   tested writes "/Font 1585 0 R", and handling only the inline form left its
   subset fonts unmapped, so two of its questions came out as shifted
   gibberish. Resolve either shape, following a chain of refs if needed. */
function dictFor(objs, body, key, depth = 0) {
  if (!body || depth > 4) return null;
  const inline = body.match(new RegExp("\\/" + key + "\\s*<<([\\s\\S]*?)>>"));
  if (inline) return inline[1];
  const ref = body.match(new RegExp("\\/" + key + "\\s+(\\d+)\\s+\\d+\\s+R"));
  if (ref) {
    const o = objs.get(Number(ref[1]));
    if (!o) return null;
    const nested = o.body.match(/<<([\s\S]*)>>/);
    return nested ? nested[1] : o.body;
  }
  return null;
}

/**
 * Resolve a page's font-name -> character-map lookup.
 *
 * The font dictionary may be inline or an indirect reference, and may sit
 * on the page or inside its /Resources; real forms use every combination.
 *
 * @returns {Map<string,?object>}
 */
function fontsForPage(objs, pageBody, fontMaps) {
  const byName = new Map();
  let fontDict = dictFor(objs, pageBody, "Font");
  if (!fontDict) {
    const resources = dictFor(objs, pageBody, "Resources");
    if (resources) fontDict = dictFor(objs, resources, "Font");
  }
  if (!fontDict) return byName;
  for (const fm of fontDict.matchAll(/\/([A-Za-z0-9#+._-]+)\s+(\d+)\s+\d+\s+R/g))
    byName.set(fm[1], fontMaps.get(Number(fm[2])) || null);
  return byName;
}

/**
 * Extract readable text from a PDF.
 *
 * @param {Uint8Array|ArrayBuffer} buffer
 * @param {(b: Uint8Array) => Promise<Uint8Array>} inflate  Injected so Node
 *        (zlib) and the browser (DecompressionStream) share this code path.
 * @returns {Promise<string>}
 * @throws {Error} If the file is not a PDF, or has no text layer — a scan
 *         is reported plainly rather than returned as noise.
 */
async function extractPdfText(buffer, inflate) {
  const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
  const raw = latin1(bytes);
  if (!raw.startsWith("%PDF")) throw new Error("That doesn't look like a PDF file.");
  const objs = findObjects(raw);
  const fontMaps = await buildFontMaps(bytes, raw, objs, inflate);

  const pages = [];
  for (const [, obj] of objs) {
    if (!/\/Type\s*\/Page[^s]/.test(obj.body)) continue;
    const fontsByName = fontsForPage(objs, obj.body, fontMaps);
    const cm = obj.body.match(/\/Contents\s*(\[[^\]]*\]|\d+\s+\d+\s+R)/);
    if (!cm) continue;
    let text = "";
    for (const ref of refsIn(cm[1])) {
      const co = objs.get(ref);
      if (!co) continue;
      const dec = await decodedStream(bytes, raw, co, inflate);
      if (dec) text += dec + "\n";
    }
    if (text) pages.push(textFromContent(text, fontsByName));
  }

  const lines = [];
  for (const p of pages) lines.push(...p);
  const out = lines.join("\n").replace(/[ \t]{2,}/g, " ").replace(/\n{3,}/g, "\n\n").trim();

  const letters = (out.match(/[A-Za-z]/g) || []).length;
  if (letters < 80) {
    throw new Error("This PDF has no readable text layer — it's most likely a scan or an image. Open it, select the text if you can, and paste it above instead.");
  }
  return out;
}

/**
 * Browser-side inflate, trying both zlib and raw framings.
 * @param {Uint8Array} bytes
 * @returns {Promise<Uint8Array>}
 */
async function inflateBytes(bytes) {
  for (const fmt of ["deflate", "deflate-raw"]) {
    try {
      const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(fmt));
      return new Uint8Array(await new Response(s).arrayBuffer());
    } catch (e) { /* try the other framing */ }
  }
  throw new Error("compressed stream");
}

/**
 * Read an uploaded application to text, dispatching on the file's signature
 * rather than its extension.
 * @param {File} file
 * @returns {Promise<string>}
 * @throws {Error} With guidance the leader can act on (paste instead).
 */
async function readApplicationFile(file) {
  const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf.slice(0, 5));
  const sig = String.fromCharCode(...head);
  if (sig.startsWith("%PDF")) return await extractPdfText(buf, inflateBytes);
  if (head[0] === 0x50 && head[1] === 0x4B)
    throw new Error("Word and Pages files aren't supported yet. Open it, select all the text, and paste it above instead.");
  const text = new TextDecoder("utf-8", { fatal: false }).decode(buf);
  if (!text.trim()) throw new Error("That file appears to be empty.");
  return text;
}

/* ---------- rendering ---------- */

const app = document.getElementById("app");
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children) if (c != null && c !== false) node.append(c);
  return node;
};

/* ---------- icons + status tags (icon+text always — never color alone) ---------- */

const ICON = {
  check: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>`,
  circle: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"></circle></svg>`,
  circleDashed: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"><circle cx="12" cy="12" r="9"></circle></svg>`,
  triangleAlert: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.8 19.5h18.4z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg>`,
  circleMinus: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8"></path></svg>`,
  circlePlus: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8"></path><path d="M8 12h8"></path></svg>`,
  mic: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>`,
  square: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="14" height="14"></rect></svg>`,
};
/**
 * One Lucide glyph as an inline SVG element.
 * @param {string} name Key into ICON.
 * @param {string} [cls] Optional class for the svg.
 * @returns {?Element}
 */
function icon(name, cls) {
  const wrap = document.createElement("span");
  wrap.innerHTML = ICON[name] || "";
  const svg = wrap.firstElementChild;
  if (svg && cls) svg.setAttribute("class", cls);
  return svg;
}
const TAG_KIND = {
  sourced: { cls: "tag tag-accent", ic: "check", text: "sourced" },
  "your-words": { cls: "tag tag-neutral", ic: "circle", text: "your words" },
  flag: { cls: "tag tag-outline", ic: "triangleAlert" },
  gap: { cls: "tag tag-outline", ic: "circleDashed", text: "gap accepted" },
};
/**
 * A status pill as icon plus text.
 *
 * Never color alone: the palette is monochrome by design, and a colour-only
 * indicator fails for red-green colour blindness regardless.
 *
 * @param {"sourced"|"your-words"|"flag"|"gap"} kind
 * @param {string} [text] Overrides the kind's default label.
 * @returns {Element}
 */
function statusTag(kind, text) {
  const m = TAG_KIND[kind] || TAG_KIND["your-words"];
  return el("span", { class: m.cls }, icon(m.ic), el("span", {}, text ?? m.text));
}

/* Every framed element (card, figure, primary button) wears four registration-
   mark corners — the system's one non-negotiable visual signature. */
function corners() {
  return [el("i", { class: "corner tl" }), el("i", { class: "corner tr" }),
    el("i", { class: "corner bl" }), el("i", { class: "corner br" })];
}
/**
 * A framed element wearing the design system's four registration marks.
 * @param {object} [attrs] Standard el() attributes.
 * @param {...*} children
 * @returns {Element}
 */
function blueprint(attrs = {}, ...children) {
  const { class: cls = "", ...rest } = attrs;
  return el("div", { ...rest, class: `blueprint ${cls}`.trim() }, ...corners(), ...children);
}

/* ---------- nav + step bar (Interview / Resolve / Review draft) ---------- */

function navBar(meta, actions = []) {
  const nav = el("div", { class: "nav" }, el("span", { class: "nav-brand" }, "GROUNDWORK"));
  if (meta) nav.append(el("span", { class: "mono small muted" }, meta));
  for (const a of actions) if (a) nav.append(a);
  return nav;
}

const STEP_NAMES = ["Interview", "Resolve", "Review draft"];
/**
 * The three-phase progress bar.
 * @param {number} activeIdx 0 Interview, 1 Resolve, 2 Review draft.
 * @param {string[]} [metas] Right-aligned status per step; a step past the
 *        end of this array shows LOCKED.
 * @returns {Element}
 */
function stepBar(activeIdx, metas = []) {
  const bar = el("div", { class: "stepbar" });
  STEP_NAMES.forEach((name, i) => {
    const kind = i < activeIdx ? "done" : (i === activeIdx ? "now" : "locked");
    const cell = el("div", { class: `step ${kind}` });
    cell.append(kind === "done" ? icon("check", "stepdone") : el("span", { class: "mono" }, String(i + 1).padStart(2, "0")));
    cell.append(el("span", { class: "steplabel" }, name));
    const meta = metas[i] ?? (kind === "locked" ? "LOCKED" : null);
    if (meta) cell.append(el("span", { class: "mono stepmeta" }, meta));
    bar.append(cell);
  });
  return bar;
}

/**
 * Unresolved gaps plus flags touching one section.
 * @param {string} sectionKey
 * @returns {number}
 */
function flagCountFor(sectionKey) {
  let n = 0;
  for (const g of Object.values(state.gaps)) if (g.section === sectionKey && !state.resolutions[g.id]) n++;
  for (const i of Object.values(state.inconsistencies)) {
    if (state.resolutions[i.id]) continue;
    const secs = (i.relatedFactIds || []).map(id => state.facts[id]).filter(Boolean).map(f => f.section);
    if (secs.includes(sectionKey)) n++;
  }
  return n;
}

/* Overall status of one section, for the Sections list and the evidence table. */
function sectionStatus(key, idx) {
  if (state.phase === "interview" && idx === state.sectionIdx) return { kind: "now" };
  if (state.phase === "interview" && idx > state.sectionIdx) return { kind: "notstarted" };
  const flags = flagCountFor(key);
  if (flags > 0) return { kind: "flag", n: flags };
  const facts = Object.values(state.facts).filter(f => f.section === key);
  const gaps = Object.values(state.gaps).filter(g => g.section === key);
  if (!facts.length && gaps.length) return { kind: "gap" };
  if (facts.length && facts.every(f => f.tier === "attributed")) return { kind: "sourced" };
  if (facts.length) return { kind: "your-words" };
  return { kind: "notstarted" };
}

/** Compact section progress bar, shown below 900px in place of the list. */
function mobileRail() {
  const rail = el("div", { class: "mobilerail", "aria-hidden": "true" });
  getSections().forEach((s, i) => rail.append(el("span", {
    class: i < state.sectionIdx ? "done" : (i === state.sectionIdx ? "now" : "") })));
  return rail;
}

/**
 * Phase 0 — disclosure, then the funder's application.
 * States what the tool will and will not do before asking for anything.
 * @returns {Element}
 */
function renderWelcome() {
  const saved = loadSave();
  const root = el("div", {}, navBar(), stepBar(0));

  const left = el("div", { style: "display:flex;flex-direction:column;gap:22px" },
    el("span", { class: "kick" }, "Before you start"),
    el("h2", { style: "max-width:16em" }, "You give the facts. You approve the draft."));

  const rows = [
    "Answer plain questions, one at a time, in your own words.",
    "We draft only from what you said — every sentence marked with its source.",
    "Anything missing or unclear comes back as a gap or a flag. You decide.",
  ];
  const numbered = el("div", { style: "display:flex;flex-direction:column;margin-top:4px" });
  rows.forEach((t, i) => numbered.append(el("div", {
    style: `display:flex;gap:18px;padding:16px 0;align-items:baseline;border-top:1px solid var(--color-divider)${i === rows.length - 1 ? ";border-bottom:1px solid var(--color-divider)" : ""}` },
    el("span", { class: "mono", style: "font-size:13px;color:var(--color-accent-700);width:28px;flex:none" }, String(i + 1).padStart(2, "0")),
    el("p", { style: "font-size:15px;line-height:1.55" }, t))));
  left.append(numbered);

  // One CTA, not three: the real "start" action lives below, next to the
  // application input it actually needs, and a saved session already gets
  // its own "Resume it / Discard" banner above. Repeating either here just
  // gave the same two actions a second (and in resume's case, third) button.
  left.append(el("p", { class: "small muted", style: "margin-top:6px" },
    saved ? "Saves as you go, in this browser." : "Add the funder's application below to begin — saves as you go."));

  const rightRows = [
    "No invented numbers, outcomes, or beneficiaries.",
    "No confidence scores — unsure material comes to you.",
    "No auto-submit. Export is yours to press.",
  ];
  const right = blueprint({ style: "padding:22px 24px;display:flex;flex-direction:column;gap:14px" },
    el("span", { class: "kick" }, "What it does not do"));
  for (const t of rightRows) right.append(el("div", { style: "display:flex;gap:11px;align-items:flex-start" },
    icon("circleMinus", ""), el("p", { style: "margin:0;font-size:14px;line-height:1.5;color:var(--color-neutral-700)" }, t)));
  right.append(el("div", { class: "hr" }),
    el("p", { class: "small muted" }, "Stays in this browser session."));

  root.append(el("div", { class: "screenpad", style: "display:grid;grid-template-columns:1fr 340px;gap:56px;align-items:start" }, left, right));

  if (saved) {
    root.append(el("div", { class: "screenpad", style: "padding-top:0" },
      el("div", { class: "banner warn" },
        el("p", {}, el("strong", {}, "You have an interview in progress.")),
        el("div", { class: "btnrow" },
          el("button", { class: "primary", onclick: () => {
            Object.assign(state, saved); render();
            if (state.phase === "drafting") runDrafting();
          }}, "Resume it"),
          el("button", { onclick: () => { clearSave(); render(); } }, "Discard and start over")))));
  }

  const appBox = el("textarea", { placeholder: "Paste the funder's application questions, RFP, or a sample application…", rows: "6" });
  const fileInput = el("input", { type: "file", accept: ".pdf,.txt,.md,.markdown,.csv,.text,application/pdf,text/*" });
  const fileNote = el("p", { class: "small muted" }, "Or upload the funder's PDF or a text file. Scanned PDFs have no text to read — for those, paste above.");
  const fileErr = el("p", { class: "errline", hidden: true });
  fileInput.addEventListener("change", async () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    fileErr.hidden = true;
    fileNote.textContent = `Reading ${f.name}…`;
    try {
      appBox.value = await readApplicationFile(f);
      const words = appBox.value.trim().split(/\s+/).length;
      fileNote.textContent = `Read ${f.name} — ${words} words. Check it looks right, then continue.`;

    } catch (e) {
      fileNote.textContent = "";
      fileErr.textContent = e.message; fileErr.hidden = false; fileInput.value = "";
    }
  });

  const priorities = el("textarea", { placeholder: "The funder's priorities, in their words (optional)…", rows: "2" });
  priorities.value = state.funderPriorities || "";
  const budget = el("textarea", { placeholder: "Optional: your project budget — one line per item.\nPersonnel, 40000\nTraining Materials, 8000", rows: "4" });

  // The priorities box is only shown when there's no application to read them
  // from. Leaving it visible next to an uploaded PDF implied it would fill on
  // upload — it doesn't; priorities are pulled during the parse and confirmed
  // on the next screen, which is where they actually appear.
  const prioWrap = el("div", { class: "stack" },
    el("h3", {}, "The funder's priorities"),
    el("p", { class: "muted small" }, "What they say they fund. Used to check your funder-fit answer."),
    priorities);
  const prioPulled = el("p", { class: "muted small", hidden: true },
    "Their priorities will be read from the application above — you'll see them on the next screen to confirm or correct.");
  const syncPrio = () => {
    const hasApp = !!appBox.value.trim();
    prioWrap.hidden = hasApp;
    prioPulled.hidden = !hasApp;
  };
  appBox.addEventListener("input", syncPrio);

  const appCard = blueprint({ class: "card" },
    el("h3", {}, "The funder's application"),
    el("p", { class: "muted small" }, "The interview adapts to whatever this asks for — their sections, their order, their wording. Leave it blank to use a standard set of grant sections instead."),
    appBox,
    el("div", { class: "filerow" }, fileInput),
    fileNote, fileErr,
    el("div", { class: "hr" }),
    prioWrap, prioPulled,
    budget);
  syncPrio();

  const err = el("p", { class: "errline", hidden: true });
  const go = el("button", { class: "primary" }, "Start the interview");
  const status = el("div", { class: "thinking", hidden: true }, el("span", { class: "dot" }), el("span", {}, "Reading the application…"));

  go.addEventListener("click", async () => {
    state.funderPriorities = priorities.value.trim();
    state.budgetLines = parseBudgetText(budget.value);
    const text = appBox.value.trim();
    if (!text) {
      state.sections = defaultSections();
      state.phase = "interview"; checkpoint(); render(); return;
    }
    if (!sampleFn) { err.textContent = "Claude access isn't available in this view, so the application can't be read."; err.hidden = false; return; }
    go.disabled = true; err.hidden = true; status.hidden = false;
    try {
      const parsed = normalizeParsed(await sampleFn.json(parseApplicationPrompt(text)));
      if (!parsed.sections.length) throw Object.assign(new Error("empty"), { code: "invalid_json" });
      // Only adopt priorities the document actually states, and never over
      // something the leader typed themselves.
      if (parsed.funderPriorities && !state.funderPriorities)
        state.funderPriorities = parsed.funderPriorities;
      state.funderName = parsed.funderName || null;
      state.parsed = parsed; state.phase = "confirm"; render();
    } catch (e) {
      go.disabled = false; status.hidden = true;
      err.textContent = (e.code === "invalid_json"
        ? "That application was too long to read in one pass. Try pasting just the section with the questions you have to answer."
        : samplingErrorCopy(e.code)) + " You can also continue with the standard sections.";
      err.hidden = false;
    }
  });

  root.append(el("div", { class: "screenpad", style: "padding-top:0" }, appCard,
    el("div", { class: "btnrow" }, go, el("span", { class: "muted small" }, "Progress saves automatically")), status, err));
  return root;
}

/**
 * Phase 0b — confirm the parsed structure before the interview starts.
 * The leader can drop sections and correct the pulled priorities; nothing
 * is asked until they agree these are the right questions.
 * @returns {Element}
 */
function renderConfirm() {
  const root = el("div", {}, navBar(state.funderName || null), stepBar(0));
  const stack = el("div", { class: "screenpad stack-lg" });
  root.append(stack);
  const parsed = (state.parsed && state.parsed.sections) || [];
  const include = new Map(parsed.map(s => [s.key, true]));

  stack.append(el("div", { class: "stack" },
    el("span", { class: "kick" }, "Before you start"),
    el("h3", {}, state.funderName ? `What I found in the ${state.funderName} application` : "Here's what I found in their application"),
    el("p", { class: "muted" }, "Uncheck anything that isn't a section you have to write. These become your interview questions.")));

  const prioBox = el("textarea", { rows: "3" });
  prioBox.value = state.funderPriorities || "";
  if (state.parsed && state.parsed.funderPriorities) {
    stack.append(blueprint({ class: "card" },
      el("h4", {}, "Their stated priorities, in their words"),
      el("p", { class: "muted small" }, "Pulled from the application itself. Correct it if I picked up the wrong passage — the funder-fit question is checked against this."),
      prioBox));
  } else {
    stack.append(blueprint({ class: "card" },
      el("h4", {}, "Their stated priorities"),
      el("p", { class: "muted small" }, "This application doesn't state what the funder is looking for. If you have it from their website or guidelines, paste it here — otherwise leave it blank."),
      prioBox));
  }

  const list = el("div", { class: "parsedlist" });
  for (const s of parsed) {
    const cb = el("input", { type: "checkbox" });
    cb.checked = true;
    cb.addEventListener("change", () => include.set(s.key, cb.checked));
    const pills = el("div", { class: "pillrow" },
      el("span", { class: "tag tag-neutral" }, CRITERIA[s.criterion]?.label || s.criterion),
      s.wordLimit && el("span", { class: "tag tag-neutral" }, `${s.wordLimit} words`),
      s.autoAssemble && el("span", { class: "tag tag-accent" }, "written from your other answers"));
    list.append(el("label", { class: "parsedrow blueprint" }, ...corners(), cb,
      el("div", { class: "pbody" },
        el("strong", {}, s.name),
        !s.autoAssemble && el("span", { class: "pq" }, s.probes[0]?.question || ""),
        pills)));
  }
  stack.append(list);

  const gaps = coverageGaps(parsed);
  if (gaps.length) stack.append(el("div", { class: "banner" },
    el("p", { class: "small" }, el("strong", {}, "Not asked by this funder: "), gaps.join(", "),
      ". That's normal — different funders ask for different things. Nothing to do unless you think they belong.")));

  stack.append(el("div", { class: "btnrow" },
    el("button", { class: "primary", onclick: () => {
      state.funderPriorities = prioBox.value.trim();
      const chosen = parsed.filter(s => include.get(s.key));
      state.sections = chosen.length ? chosen : defaultSections();
      state.parsed = null; state.phase = "interview"; checkpoint(); render();
    }}, "Start the interview"),
    el("button", { onclick: () => {
      state.funderPriorities = prioBox.value.trim();
      state.sections = defaultSections();
      state.parsed = null; state.phase = "interview"; checkpoint(); render();
    }}, "Use standard sections instead")));
  return root;
}

/* ---------- voice (Interview phase only) ----------
   Offered, never imposed: typing stays equally reachable. The hard rule is
   that voice never writes straight into the draft — recognition only ever
   fills the SAME textarea a typed answer would, so the existing
   review-then-"Save & continue" path is the one and only way anything is
   recorded, spoken or typed. */
let voiceUI = { mode: "idle" };
const SpeechRec = (typeof window !== "undefined") && (window.SpeechRecognition || window.webkitSpeechRecognition);

/**
 * Begin browser speech recognition for the current answer.
 *
 * Transcription only ever fills the same textarea a typed answer would, so
 * the review-then-save path is identical either way — voice never writes
 * into the draft directly.
 *
 * @param {Function} rerender Called as interim results arrive.
 */
function startVoice(rerender) {
  if (!SpeechRec) return;
  let rec;
  try { rec = new SpeechRec(); } catch (e) { return; }
  rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
  voiceUI = { mode: "recording", interim: "", final: "", recognition: rec };
  rec.onresult = (ev) => {
    let interim = "", final = voiceUI.final;
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) final += r[0].transcript + " "; else interim += r[0].transcript;
    }
    voiceUI.final = final; voiceUI.interim = interim; rerender();
  };
  rec.onerror = () => { voiceUI = { mode: "idle" }; rerender(); };
  rec.onend = () => { if (voiceUI.mode === "recording") { voiceUI.mode = "idle"; rerender(); } };
  try { rec.start(); } catch (e) { voiceUI = { mode: "idle" }; return; }
  rerender();
}
/**
 * Stop recognition and drop the transcript unsaved.
 * @param {Function} rerender
 */
function discardVoice(rerender) {
  if (voiceUI.recognition) { try { voiceUI.recognition.stop(); } catch (e) {} }
  voiceUI = { mode: "idle" };
  rerender();
}

/**
 * Phase 1 — one question at a time, with the draft building alongside.
 * @returns {Element}
 */
function renderInterview() {
  const secs = getSections();
  const cur = currentProbe();
  let progIdx = 0;
  for (let i = 0; i < state.sectionIdx; i++) progIdx += (secs[i].probes ? secs[i].probes.length : 0);
  progIdx += state.probeIdx;
  const progTotal = secs.reduce((n, s) => n + (s.probes ? s.probes.length : 0), 0);
  const flagsWaiting = Object.keys(state.gaps).length + Object.keys(state.inconsistencies).length;

  const root = el("div", {},
    navBar(state.funderName ? state.funderName.toUpperCase() : null,
      [el("span", { class: "tag tag-neutral mono" }, "SAVED")]),
    stepBar(0, [`Q${String(progIdx + 1).padStart(2, "0")} / ${progTotal}`, `${flagsWaiting} FLAG${flagsWaiting === 1 ? "" : "S"} WAITING`]));

  if (sampleDead) {
    root.append(el("div", { class: "screenpad" }, el("div", { class: "banner warn" },
      el("p", {}, "This page needs Claude access to evaluate answers, and it isn't available in this view. Your progress is saved."))));
    return root;
  }
  if (!cur) return root;
  const { section, probe } = cur;
  root.append(mobileRail());

  /* ---- left: the question ---- */
  const left = el("div", { style: "padding:34px 36px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--color-divider)" });

  if (state.autoGapNotice) {
    left.append(el("div", { class: "banner warn" }, el("p", { class: "small" }, state.autoGapNotice)));
    state.autoGapNotice = null;
  }

  const metaRow = el("div", { style: "display:flex;align-items:center;gap:12px;flex-wrap:wrap" },
    el("span", { class: "kick" }, section.name),
    el("span", { class: "mono small muted" },
      section.probes.length > 1 ? `PART ${probe && section.probes.indexOf(probe) + 1} OF ${section.probes.length}` : `QUESTION ${progIdx + 1} OF ${progTotal}`));
  if (section.wordLimit) metaRow.append(el("span", { class: "tag tag-neutral" }, `${section.wordLimit} words`));
  if (state.attempts > 0) metaRow.append(el("span", { class: "mono small", style: "color:var(--color-flag)" }, `ATTEMPT ${state.attempts + 1} OF 3`));
  left.append(metaRow, el("h3", { style: "max-width:20em" }, probe.question));

  if (section.criterion === "FIT" && state.funderPriorities)
    left.append(el("p", { class: "muted small" }, `Their priorities: "${state.funderPriorities}"`));

  // "Why reviewers care" sits above the input, always visible — the
  // explanation comes before the ask. A live coaching note (after a miss)
  // takes priority over the static "why" when both would otherwise show.
  //
  // On a miss, what the leader already brought and what's still needed render
  // as two separate blocks with different treatments. They are never merged
  // into one sentence: the affirmation must not be able to soften the verdict.
  if (state.coachNote) {
    if (state.coachStrength)
      left.append(el("div", { class: "strengthnote" }, icon("check"), el("p", {}, state.coachStrength)));
    left.append(el("div", { class: "coachnote" }, el("p", {}, el("strong", {}, "Still needed: "), state.coachNote)));
  } else if (probe.why) {
    left.append(el("div", { class: "coachnote" }, el("p", {}, el("strong", {}, "Why reviewers care: "), probe.why)));
  }

  const box = el("textarea", { placeholder: "Answer in your own words — specifics welcome…" });
  // A miss used to wipe whatever the leader had just typed, forcing a
  // from-memory retype while they're also reading a coaching note — the
  // single biggest friction point found in testing. Restore it instead.
  if (state.lastAttemptText) box.value = state.lastAttemptText;
  const field = el("div", { class: "stack" }, el("label", { class: "fieldlabel" }, "Your answer — in your own words"));

  if (voiceUI.mode === "recording") {
    const bars = Array.from({ length: 19 }, () => 10 + Math.round(Math.random() * 34));
    const wave = el("div", { class: "waveform" });
    bars.forEach(h => wave.append(el("i", { style: `height:${h}px` })));
    const liveText = el("p", { style: "margin:0;font-size:16px;line-height:1.65" },
      voiceUI.final, el("span", { style: "color:var(--color-neutral-600)" }, voiceUI.interim), el("span", { class: "caret mono" }, " ▌"));
    const stopBtn = el("button", { class: "primary" }, icon("square"), "Stop & review text");
    const discardBtn = el("button", { class: "link" }, "Discard");
    stopBtn.addEventListener("click", () => { box.value = (voiceUI.final || "").trim(); voiceUI = { mode: "idle" }; render(); });
    discardBtn.addEventListener("click", () => discardVoice(render));
    field.append(blueprint({ style: "padding:22px 24px;display:flex;flex-direction:column;gap:18px;border-color:var(--color-accent)" },
      wave, liveText,
      el("div", { style: "display:flex;gap:10px;align-items:center;padding-top:6px;border-top:1px solid var(--color-divider)" },
        stopBtn, discardBtn,
        el("span", { style: "margin-left:auto;font-size:13px;color:var(--color-neutral-700)" }, "Listening — nothing saves until you review the text."))));
  } else {
    if (SpeechRec) {
      const talkBtn = el("button", { class: "primary miclarge" }, icon("mic"));
      talkBtn.addEventListener("click", () => startVoice(render));
      field.append(blueprint({ class: "voicepanel" }, talkBtn,
        el("div", {},
          el("div", { style: "font-family:var(--font-heading);font-size:17px" }, "Talk it through…"),
          el("p", { class: "small muted", style: "margin:4px 0 0" }, "You'll see the transcript and can correct it before anything saves."))));
      field.append(el("div", { class: "ortype" }, el("span", { class: "rule" }), el("span", { class: "mono small muted" }, "OR TYPE IT"), el("span", { class: "rule" })));
    }
    field.append(box);
  }

  const err = el("p", { class: "errline", hidden: true });
  const submit = el("button", { class: "primary" }, "Save & continue");
  const skip = el("button", {}, "I don't know yet — flag as gap");
  const status = el("div", { class: "thinking", hidden: true }, el("span", { class: "dot" }), el("span", {}, "Reviewing…"));

  const doSubmit = async () => {
    const reply = box.value.trim();
    if (!reply) return;
    submit.disabled = true; skip.disabled = true; box.disabled = true;
    err.hidden = true; status.hidden = false;
    try { await submitAnswer(reply); render(); }
    catch (e) {
      status.hidden = true; submit.disabled = false; skip.disabled = false; box.disabled = false;
      err.textContent = samplingErrorCopy(e.code); err.hidden = false;
    }
  };
  submit.addEventListener("click", doSubmit);
  box.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); doSubmit(); } });
  skip.addEventListener("click", skipCurrent);

  left.append(field,
    el("div", { class: "btnrow" }, submit, skip,
      el("span", { style: "margin-left:auto;font-size:13px;color:var(--color-neutral-700)" }, "Nothing enters the draft until you save.")),
    err, status);

  const secFacts = Object.values(state.facts).filter(f => f.section === section.key);
  if (secFacts.length) {
    left.append(el("div", { class: "hr" }), el("span", { class: "kick", style: "color:var(--color-neutral-700)" }, "Answered in this section"));
    const answeredList = el("div", {});
    secFacts.forEach((f, i) => answeredList.append(el("div", {
      style: `display:flex;gap:12px;padding:12px 0;align-items:center;${i < secFacts.length - 1 ? "border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent)" : ""}` },
      el("span", { class: "mono small muted", style: "flex:none;width:34px" }, `A${i + 1}`),
      el("span", { style: "font-size:14px;line-height:1.5;flex:1" }, f.summary),
      statusTag(f.tier === "attributed" ? "sourced" : "your-words"))));
    left.append(answeredList);
  }

  /* ---- right: draft, as it stands (locally assembled from your own facts —
     no extra model call here; the polished, grounding-checked version is
     built once at Review draft) ---- */
  const right = el("div", { style: "padding:30px 32px;display:flex;flex-direction:column;gap:18px;background:color-mix(in srgb,var(--color-text) 3%,transparent)" });
  const secLiveFacts = dedupeFacts(secFacts);
  const words = secLiveFacts.reduce((n, f) => n + f.summary.trim().split(/\s+/).filter(Boolean).length, 0);
  right.append(el("div", { style: "display:flex;align-items:baseline;gap:10px" },
    el("span", { class: "kick" }, "Draft, as it stands"),
    el("span", { class: "mono small muted", style: "margin-left:auto" },
      section.wordLimit ? `${words} / ${section.wordLimit} WORDS` : `${words} WORDS`)));

  const draftCard = blueprint({ class: "draftcard" }, el("h5", {}, section.name));
  if (secLiveFacts.length) {
    const p = el("p", {});
    secLiveFacts.forEach((f, i) => p.append(el("span", { class: i === secLiveFacts.length - 1 ? "hl" : "" }, asSentence(f.summary) + " ")));
    draftCard.append(p);
  } else {
    draftCard.append(el("p", { class: "muted" }, "Nothing recorded yet for this section."));
  }
  right.append(draftCard,
    el("div", { class: "oversight" }, icon("check"),
      el("p", {}, "Nothing here was written without your review. Highlighted text came from the answer you're writing now.")));

  right.append(el("span", { class: "kick", style: "color:var(--color-neutral-700)" }, "Sections"));
  const secList = el("ul", { class: "seclist" });
  secs.forEach((s, i) => {
    const st = sectionStatus(s.key, i);
    const li = el("li", { class: st.kind === "now" ? "now" : (st.kind === "notstarted" ? "notstarted" : "") },
      el("span", {}, s.name));
    if (st.kind === "now") li.append(el("span", { class: "mono small", style: "color:var(--color-accent-700)" }, "IN PROGRESS"));
    else if (st.kind === "notstarted") li.append(el("span", { class: "mono small" }, "NOT STARTED"));
    else if (st.kind === "flag") li.append(statusTag("flag", `${st.n} flag${st.n === 1 ? "" : "s"}`));
    else if (st.kind === "gap") li.append(statusTag("gap"));
    else if (st.kind === "sourced") li.append(statusTag("sourced"));
    else li.append(statusTag("your-words"));
    secList.append(li);
  });
  right.append(secList);

  root.append(el("div", { style: "display:grid;grid-template-columns:1fr 452px;min-height:600px" }, left, right));
  if (voiceUI.mode !== "recording") setTimeout(() => box.focus(), 0);
  return root;
}

/**
 * Plain-language reason this item needs a human decision.
 * @param {boolean} isGap
 * @param {?object} inc  The inconsistency, when it is not a gap.
 * @returns {string}
 */
function whyFlagged(isGap, inc) {
  if (isGap) return "A reviewer notices missing evidence either way — a marked gap is fixable; an unmarked one looks like an oversight.";
  if (inc?.kind === "budget") return "Reviewers read the budget as a numerical version of the plan, and check the two agree.";
  return "Two of your own statements point different directions. Only you know whether they measure different things.";
}

const RESOLUTION_LABEL = { corrected: "CORRECTED BY YOU", explained: "EXPLAINED BY YOU", accepted: "ACCEPTED AS-IS", overridden: "KEPT YOUR ORIGINAL" };

/**
 * Phase 2 — every flag and gap, one decision at a time.
 * The queue is fully visible so the leader can see the whole scope of what
 * is waiting rather than meeting it one hidden item at a time.
 * @returns {Element}
 */
function renderResolution() {
  const total = state.resolveQueue.length, idx = state.resolveIdx;
  if (idx >= total) { state.phase = "drafting"; checkpoint(); runDrafting(); return el("div"); }

  const secs = getSections();
  const progTotal = secs.reduce((n, s) => n + (s.probes ? s.probes.length : 0), 0);
  const doneCount = state.resolveQueue.filter(id => state.resolutions[id]).length;

  const root = el("div", {},
    navBar(`${state.funderName ? state.funderName.toUpperCase() + " · " : ""}INTERVIEW COMPLETE`),
    stepBar(1, [`${progTotal} / ${progTotal}`, `${doneCount} OF ${total} DONE`]));

  const grid = el("div", { style: "display:grid;grid-template-columns:330px 1fr;min-height:610px" });

  /* ---- left: scannable queue — every item, not one hidden at a time ---- */
  const left = el("div", { style: "border-right:1px solid var(--color-divider);padding:24px 0;display:flex;flex-direction:column" },
    el("div", { style: "padding:0 22px 14px" },
      el("span", { class: "kick" }, "Needs your decision"),
      el("p", { class: "small muted", style: "margin:8px 0 0" }, `${total} item${total === 1 ? "" : "s"}. None of them resolve without you.`)));
  const queue = el("div", { class: "queue" });
  state.resolveQueue.forEach((id, i) => {
    const g = state.gaps[id], ic = state.inconsistencies[id];
    const isG = !!g;
    const resolution = state.resolutions[id];
    const title = isG ? g.reason : ic.description;
    const kindLabel = (isG ? `GAP · ${sectionName(g.section)}`
      : `FLAG · ${[...new Set((ic.relatedFactIds || []).map(fid => state.facts[fid]).filter(Boolean).map(f => sectionName(f.section)))].join(", ")}`).toUpperCase();
    const btn = el("button", { class: `queueitem ${i === idx ? "now" : ""} ${resolution ? "done" : ""}`.trim() },
      icon(resolution ? "check" : (isG ? "circleDashed" : "triangleAlert")),
      el("div", {},
        el("div", { class: "queuetitle" }, title.length > 84 ? title.slice(0, 82) + "…" : title),
        el("div", { class: "queuesub" }, resolution ? (RESOLUTION_LABEL[resolution.resolution] || "RESOLVED") : kindLabel)));
    if (resolution) btn.disabled = true;
    else if (i !== idx) btn.addEventListener("click", () => { state.resolveIdx = i; render(); });
    queue.append(btn);
  });
  left.append(queue);

  /* ---- right: the decision, one at a time ---- */
  const flagId = state.resolveQueue[idx];
  const gap = state.gaps[flagId], inc = state.inconsistencies[flagId];
  const isGap = !!gap;
  const right = el("div", { style: "padding:34px 40px;display:flex;flex-direction:column;gap:22px" });
  right.append(el("div", { style: "display:flex;align-items:center;gap:10px;flex-wrap:wrap" },
    el("span", { class: "tag tag-accent" }, icon(isGap ? "circleDashed" : "triangleAlert"), `${isGap ? "Gap" : "Flag"} ${idx + 1} of ${total}`),
    el("span", { class: "mono small muted" }, (isGap ? "ACCEPTED GAP" : (inc.kind === "budget" ? "NARRATIVE-TO-BUDGET FIT" : (CRITERIA[inc.criterion]?.label || inc.criterion))).toUpperCase())));
  right.append(el("h3", { style: "max-width:28em" }, isGap ? gap.reason : inc.description));
  // A gap from three exhausted attempts otherwise loses all context by the
  // time it reaches this screen — the leader is asked to "correct" something
  // with no reminder of the question or what they already tried.
  if (isGap && (gap.question || gap.lastAttempt)) {
    const ctx = el("div", { class: "stack", style: "gap:6px" });
    if (gap.question) ctx.append(el("p", { class: "small muted" }, el("strong", {}, "Question: "), gap.question));
    if (gap.lastAttempt) ctx.append(el("p", { class: "small muted" }, el("strong", {}, "You tried: "), `"${gap.lastAttempt}"`));
    right.append(ctx);
  }
  right.append(el("div", { class: "decisionbox" }, el("p", {}, el("strong", {}, "Why it matters: "), whyFlagged(isGap, inc))));

  let targetFactId = null;
  if (!isGap && inc.relatedFactIds?.length) {
    const facts = inc.relatedFactIds.map(id => state.facts[id]).filter(Boolean);
    if (facts.length === 1) {
      right.append(blueprint({ class: "card" }, el("div", { class: "evidence" }, el("div", { class: "evrow" },
        statusTag(facts[0].tier === "attributed" ? "sourced" : "your-words"),
        el("span", {}, el("strong", {}, sectionName(facts[0].section) + ": "), facts[0].summary)))));
      targetFactId = facts[0].id;
    } else if (facts.length > 1) {
      right.append(el("p", { class: "small muted" }, "If you correct one, choose which:"));
      targetFactId = facts[facts.length - 1].id;
      const group = el("div", { class: "stack", role: "radiogroup", "aria-label": "Which statement to correct" });
      facts.forEach((f, i2) => {
        const radio = el("input", { type: "radio", name: "targetfact" });
        radio.checked = i2 === facts.length - 1;
        radio.addEventListener("change", () => { targetFactId = f.id; });
        group.append(el("label", { class: "radio factpick blueprint" }, ...corners(), radio, el("span", { class: "dot" }),
          el("span", {}, el("strong", {}, sectionName(f.section) + ": "), f.summary)));
      });
      right.append(group);
    }
  }

  const valueBox = el("input", { type: "text", placeholder: "Corrected value or statement…", hidden: true });
  // A gap reached after three attempts already holds what the leader wrote.
  // Prefilling it means correcting is an edit, not a retype from memory.
  if (isGap && gap.lastAttempt) valueBox.value = gap.lastAttempt;
  const noteBox = el("input", { type: "text", placeholder: "Your explanation (kept with the record)…", hidden: true });
  const confirm = el("button", { class: "primary", hidden: true }, "Apply");
  let mode = null;
  const finishOne = () => { state.resolveIdx += 1; checkpoint(); render(); };
  const pick = (m) => {
    mode = m;
    valueBox.hidden = m !== "corrected"; noteBox.hidden = m !== "explained";
    confirm.hidden = !(m === "corrected" || m === "explained");
    if (m === "accepted") { applyResolution(flagId, "accepted", null, null, null); finishOne(); }
    if (m === "overridden") { applyResolution(flagId, "overridden", null, null, targetFactId); finishOne(); }
    if (m === "corrected") valueBox.focus();
    if (m === "explained") noteBox.focus();
  };
  confirm.addEventListener("click", () => {
    if (mode === "corrected" && valueBox.value.trim()) applyResolution(flagId, "corrected", valueBox.value.trim(), null, targetFactId);
    else if (mode === "explained" && noteBox.value.trim()) applyResolution(flagId, "explained", null, noteBox.value.trim(), targetFactId);
    else return;
    finishOne();
  });

  right.append(el("div", { class: "btnrow" },
    el("button", { onclick: () => pick("corrected") }, "Correct it"),
    el("button", { onclick: () => pick("explained") }, "Explain it"),
    el("button", { onclick: () => pick("accepted") }, isGap ? "Leave as a gap" : "Accept"),
    !isGap && el("button", { onclick: () => pick("overridden") }, "Keep my original")),
    valueBox, noteBox, confirm);

  const remaining = total - doneCount;
  const gateBtn = el("button", {}, `Go to draft · ${remaining} left`);
  gateBtn.disabled = remaining > 0;
  gateBtn.addEventListener("click", () => { state.phase = "drafting"; checkpoint(); runDrafting(); });
  right.append(el("div", { style: "margin-top:auto;padding-top:18px;border-top:1px solid var(--color-divider);display:flex;align-items:center;gap:12px;flex-wrap:wrap" },
    el("span", { class: "small muted" }, "Review draft unlocks when every item is resolved or knowingly accepted."),
    el("span", { style: "margin-left:auto" }, gateBtn)));

  grid.append(left, right);
  root.append(grid);
  return root;
}

/**
 * Phase 2b — the assembly interstitial, showing progress per section.
 * @returns {Element}
 */
function renderDrafting() {
  const secs = getSections();
  const progTotal = secs.reduce((n, s) => n + (s.probes ? s.probes.length : 0), 0);
  const total = state.resolveQueue.length;
  return el("div", {},
    navBar(state.funderName ? state.funderName.toUpperCase() : null),
    stepBar(2, [`${progTotal} / ${progTotal}`, `${total} / ${total}`]),
    el("div", { class: "screenpad" }, blueprint({ class: "card" },
      el("div", { class: "thinking" }, el("span", { class: "dot" }),
        el("span", { id: "draftprogress" }, "Assembling your draft…")),
      el("p", { class: "muted small" }, "Written only from your resolved facts, then checked: any number that doesn't trace back to something you said sends that section to plain phrasing."))));
}

/**
 * The record behind one drafted section: each fact's tier and the leader's
 * own words. This is what "see the answers behind it" opens.
 * @param {string} sectionKey
 * @returns {?Element}
 */
function provenanceFor(sectionKey) {
  const facts = Object.values(state.facts).filter(f => f.section === sectionKey);
  if (!facts.length) return null;
  const ev = el("div", { class: "evidence" });
  for (const f of facts) ev.append(el("div", { class: "evrow" },
    statusTag(f.tier === "attributed" ? "sourced" : "your-words"),
    el("span", {}, el("strong", {}, "You said: "), `"${f.verbatim}"`)));
  return ev;
}

/**
 * Phase 3 — the draft, approved section by section, with the evidence
 * table alongside and the reflection summary above it.
 * @returns {Element}
 */
function renderOutput() {
  const secs = getSections();
  const progTotal = secs.reduce((n, s) => n + (s.probes ? s.probes.length : 0), 0);
  const totalFlags = state.resolveQueue.length;
  const realSecs = secs.filter(s => !s.autoAssemble);
  const isGapOnlyText = (t) => !!t && /^(\s*\[GAP:[^\]]*\]\s*)+$/.test(t);
  const approvedCount = realSecs.filter(s => {
    const d = state.drafts.find(x => x.section === s.key);
    return state.approvals[s.key] && !(d && isGapOnlyText(d.text));
  }).length;

  const copyBtn = el("button", {}, "Copy draft + table");
  copyBtn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(draftAsMarkdown()); copyBtn.textContent = "Copied"; }
    catch (e) { copyBtn.textContent = "Copy failed — select and copy manually"; }
    setTimeout(() => { copyBtn.textContent = "Copy draft + table"; }, 2500);
  });
  const navExtra = el("span", { style: "display:flex;gap:10px" }, copyBtn);
  if (window.claude && typeof window.claude.use === "function") claude.use("downloads").then(downloads => {
    if (!downloads) return;
    const dl = el("button", {}, "Download as Markdown");
    dl.addEventListener("click", async () => {
      try { await downloads.save({ filename: "grant-narrative-draft.md", data: draftAsMarkdown() }); } catch (e) {}
    });
    navExtra.append(dl);
  });

  const root = el("div", {},
    navBar(state.funderName ? state.funderName.toUpperCase() : null, [navExtra]),
    stepBar(2, [`${progTotal} / ${progTotal}`, `${totalFlags} / ${totalFlags}`, `${approvedCount} OF ${realSecs.length} APPROVED`]));

  /* ---- left: the draft, section by section ---- */
  const left = el("div", { style: "padding:32px 40px;display:flex;flex-direction:column;gap:20px;border-right:1px solid var(--color-divider)" });
  const totalWords = (state.drafts || []).reduce((n, d) => n + (d.text || "").trim().split(/\s+/).filter(Boolean).length, 0);
  left.append(el("div", { style: "display:flex;align-items:baseline;gap:12px;flex-wrap:wrap" },
    el("h4", {}, "Grant Narrative Draft"),
    el("span", { class: "mono small muted", style: "margin-left:auto" }, `${totalWords} WORDS · ${state.drafts.length} SECTIONS`)));
  left.append(el("p", { class: "muted small", style: "max-width:48em" },
    "Assembled only from facts you stated and approved. Groundwork cannot verify whether an outcome or impact claim is true — approve each section to say you stand behind it."));

  const insights = reflectionInsights();
  if (insights.length) {
    const card = blueprint({ class: "card" }, el("span", { class: "kick" }, "What this surfaced"));
    for (const n of insights) card.append(el("p", { style: "font-size:14px;line-height:1.55" }, n));
    left.append(card);
  }

  for (const d of state.drafts) {
    const sec = secs.find(s => s.key === d.section);
    const facts = Object.values(state.facts).filter(f => f.section === d.section);
    const basisTag = !facts.length ? null : (facts.every(f => f.tier === "attributed") ? "sourced" : "your-words");

    if (!sec?.autoAssemble && isGapOnlyText(d.text)) {
      const idx2 = secs.findIndex(s => s.key === d.section);
      const fillBtn = el("button", { style: "margin-left:auto;flex:none" }, "Fill it in now…");
      fillBtn.addEventListener("click", () => {
        state.sectionIdx = idx2; state.probeIdx = 0; state.phase = "interview"; checkpoint(); render();
      });
      left.append(blueprint({ style: "padding:18px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap" },
        icon("circleDashed"),
        el("div", {}, el("div", { style: "font-family:var(--font-heading);font-size:16px" }, `${d.name} — left as a gap`),
          el("div", { class: "small muted" }, "Exports as a visible placeholder so you don't submit it by accident.")),
        fillBtn));
      continue;
    }

    const approved = !!state.approvals[d.section];
    const card = blueprint({ class: "card" + (approved ? "" : " accent") },
      el("div", { style: "display:flex;align-items:center;gap:10px;flex-wrap:wrap" },
        el("h5", {}, d.name),
        basisTag && statusTag(basisTag),
        el("span", { class: "mono small", style: `margin-left:auto;color:${approved ? "var(--color-accent-700)" : "var(--color-neutral-700)"}` },
          approved ? "APPROVED BY YOU" : "NEEDS YOUR APPROVAL")));

    if (d.fallback) card.append(el("p", { class: "fallbacknote" }, "Plain phrasing — the polished version didn't pass the numbers check, so your own wording stands."));

    const p = el("p", {});
    (d.text || "(nothing recorded for this section)").split(/(\[GAP:[^\]]*\])/g).forEach(part => {
      if (part.startsWith("[GAP:")) p.append(el("span", { class: "gapmark" }, part));
      else if (part) p.append(part);
    });
    card.append(p);

    const evWrap = el("div", { hidden: true });
    const editWrap = el("div", { class: "stack", hidden: true });

    if (!approved) {
      const approveBtn = el("button", { class: "primary" }, "Approve section");
      approveBtn.addEventListener("click", () => { state.approvals[d.section] = true; render(); });
      const editBtn = el("button", {}, "Edit wording…");
      editBtn.addEventListener("click", () => { editWrap.hidden = !editWrap.hidden; });
      const seeBtn = el("button", { class: "link" }, "See the answers behind it…");
      seeBtn.addEventListener("click", () => { evWrap.hidden = !evWrap.hidden; });
      card.append(el("div", { style: "display:flex;gap:9px;align-items:center;margin-top:4px;flex-wrap:wrap" }, approveBtn, editBtn, seeBtn));

      const editBox = el("textarea", {});
      editBox.value = d.text || "";
      const saveEdit = el("button", { class: "primary" }, "Save wording");
      saveEdit.addEventListener("click", () => { d.text = editBox.value; editWrap.hidden = true; render(); });
      editWrap.append(editBox, el("div", { class: "btnrow" }, saveEdit,
        el("button", { onclick: () => { editWrap.hidden = true; render(); } }, "Cancel")));
      card.append(editWrap);
    }

    const prov = provenanceFor(d.section);
    if (prov) { evWrap.append(prov); card.append(evWrap); }
    left.append(card);
  }

  /* ---- right: evidence, board-ready summary (full detail is in the export) ---- */
  const right = el("div", { style: "padding:30px;display:flex;flex-direction:column;gap:16px;background:color-mix(in srgb,var(--color-text) 3%,transparent)" });
  right.append(el("span", { class: "kick" }, "Evidence table"),
    el("p", { class: "small muted" }, "Shows what's covered, not whether it's convincing."));

  const table = el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Area"), el("th", {}, "Basis"), el("th", {}, "State"))));
  const tbody = el("tbody", {});
  for (const s of realSecs) {
    const d = state.drafts.find(x => x.section === s.key);
    const facts = Object.values(state.facts).filter(f => f.section === s.key);
    const gapOnly = isGapOnlyText(d && d.text);
    const basis = !facts.length ? "—" : (facts.every(f => f.tier === "attributed") ? "sourced" : "your words");
    const st = gapOnly ? "gap" : (state.approvals[s.key] ? "approved" : "pending");
    tbody.append(el("tr", {}, el("td", {}, s.name), el("td", {}, basis),
      el("td", {}, el("span", { class: st === "gap" ? "tag tag-outline" : "tag tag-neutral" }, st))));
  }
  table.append(tbody);
  right.append(el("div", { class: "tablewrap" }, table));

  right.append(el("div", { class: "oversight" }, icon("circlePlus"),
    el("p", {}, "Every sentence in this draft traces to an answer you gave. Open any section's “see the answers behind it” to see the record you'd show a board.")));

  const outstanding = realSecs.length - approvedCount;
  const exportBtn = el("button", { class: "primary", style: "width:100%;margin-top:2px" },
    outstanding > 0 ? `Export · ${outstanding} section${outstanding === 1 ? "" : "s"} still unapproved` : "Export");
  exportBtn.addEventListener("click", () => copyBtn.click());
  const newBtn = el("button", { class: "link", onclick: () => {
    if (window.confirm("Start a new interview? This draft stays on screen only until you leave.")) { clearSave(); location.reload(); }
  }}, "Start a new interview");
  right.append(el("div", { style: "margin-top:auto;padding-top:16px;border-top:1px solid var(--color-divider)" },
    el("p", { class: "small muted", style: "margin:0 0 10px" }, "Export includes the narrative, the evidence table, and one visible placeholder for any accepted gap."),
    exportBtn,
    el("p", { class: "small", style: "margin-top:10px" }, newBtn)));

  root.append(el("div", { style: "display:grid;grid-template-columns:1fr 400px;min-height:620px" }, left, right));
  return root;
}

/** Render the current phase into #app, replacing whatever was there. */
function render() {
  app.replaceChildren();
  let view;
  if (state.phase === "welcome") view = renderWelcome();
  else if (state.phase === "confirm") view = renderConfirm();
  else if (state.phase === "interview") view = renderInterview();
  else if (state.phase === "resolution") view = renderResolution();
  else if (state.phase === "drafting") view = renderDrafting();
  else view = renderOutput();
  app.append(view);
}

/* ---------- boot ---------- */

render();
if (window.claude && typeof window.claude.use === "function") {
  claude.use("sample").then(fn => {
    sampleFn = fn;
    if (!fn) { sampleDead = true; if (state.phase !== "welcome") render(); }
  });
} else { sampleDead = true; }
</script>
